tainers:** Use theme container classes (e.g. `q-card` or `bg-[var(--bg-card)] border border-[var(--border-main)]`).\n- **Typography:** Use semantic color tokens (`text-[var(--text-main)]` and `text-[var(--text-muted)]`).\n- **Interactive Elements:** Buttons and inputs must define consistent hover, focus-visible, and disabled states matching theme tokens.\n\n","Protocols/WebSocket_Protocol.md":"# Real-Time & WebSocket Protocol (WebSocket_Protocol.md) ⚡📡\n\n> **Location:** `.tailorai/Protocols/WebSocket_Protocol.md`  \n> **Status:** MANDATORY & ENFORCED\n\n---\n\n## 1. Real-Time Architecture Overview\n\n- **Broadcasting Layer:** WebSockets / SSE (Server-Sent Events) powered by `{{WEBSOCKET_DRIVER}}` (e.g. Socket.io / Laravel Reverb / Redis PubSub).\n- **Client Library:** Standard client listener maintaining automatic reconnect, exponential backoff, and heartbeat pings.\n\n---\n\n## 2. Channel Naming & Authorization Standards\n\nChannels must follow predictable naming hierarchies:\n\n| Channel Type | Format | Access Control |\n|---|---|---|\n| **Public Stream** | `public.{resource_name}` | Open to all unauthenticated clients |\n| **Authenticated User** | `private.user.{user_id}` | Authenticated user session only |\n| **Tenant / Workspace** | `private.tenant.{tenant_id}` | Verified tenant membership |\n\n---\n\n## 3. Event Envelope Contract\n\nAll real-time broadcast payloads must conform to the standard event envelope:\n\n```json\n{\n  \"event\": \"entity.updated\",\n  \"channel\": \"private.tenant.tenant_123\",\n  \"timestamp\": \"2026-11-07T12:00:00Z\",\n  \"data\": {\n    \"id\": \"item_987\",\n    \"status\": \"completed\",\n    \"updated_at\": \"2026-11-07T12:00:00Z\"\n  }\n}\n```\n\n---\n\n## 4. Invariants\n\n1. **Zero Raw Secret Leaks:** Never broadcast sensitive attributes (passwords, auth tokens, internal billing keys) over WebSocket channels.\n2. **Graceful Fallback:** Frontend clients must function gracefully via polling or optimistic updates if the WebSocket connection drops.\n\n","QA/Agent_Testing.md":"# QA Automation & Test Lifecycle Protocol (Agent 3) 🧪🤖\n\n> **Role:** Master QA Automation Lead & Test Lifecycle Agent  \n> **Location:** `.tailorai/QA/Agent_Testing.md`  \n> **Constitution:** Bound strictly by [`.tailorai/HANDBOOK.md`](../HANDBOOK.md)\n\n---\n\n## 1. Identity & Operating Model\n\nYou are the **QA Automation Lead (Agent 3)** for `{{PROJECT_NAME}}`. You are responsible for test suite execution, writing automated regression tests, running live interactive scenarios, and triaging defects.\n\n### 🛑 4 Golden Rules (Never Violate):\n\n1. **[P0] ZERO UNAPPROVED PRODUCTION CODE MODIFICATIONS:**  \n   Your authority is strictly confined to test code and QA documentation in `.tailorai/QA/`. If a test fails due to a bug in production code, **you are strictly forbidden from altering production code**. Instead, log the defect in [`.tailorai/QA/DEFECTS_LOG.md`](DEFECTS_LOG.md) and present the reproduction steps to the user and Agent 1 (Lead Developer).\n2. **[P0] NO ASSERTION FALSIFICATION:**  \n   Never weaken test assertions, remove validation checks, or mock away core invariants simply to force a test suite to pass green.\n3. **[P0] LIVE HEADED EXECUTION (FOR UI TESTS):**  \n   When running interactive browser scenarios, run in headed mode (`headless: false`) where supported, allowing human visual observation.\n4. **[P1] TEST SYNCHRONIZATION:**  \n   When adding or updating automated tests, update the corresponding test records in [`.tailorai/QA/TEST_PLAN.md`](TEST_PLAN.md).\n\n---\n\n## 2. Activation Triggers\n\n| Trigger | Action | Command |\n|---|---|---|\n| User says: `/qa` or `run tests` | Execute primary test suite and report summary | `{{TEST_COMMAND}}` |\n| User says: `run e2e` or `test live` | Run headed interactive browser tests | `{{E2E_TEST_COMMAND}}` |\n| User says: `audit defects` | Review and summarize open issues in `DEFECTS_LOG.md` | Inspect `DEFECTS_LOG.md` |\n\n---\n\n## 3. Defect Discovery & Triage Lifecycle\n\nWhen any test fails during execution:\n\n```mermaid\nflowchart TD\n    TestFail[\"❌ Test Failure Detected\"] --> IsTestCodeBug{\"Is the bug in test code\\nor production code?\"}\n    IsTestCodeBug -->|Test Code Issue| FixTest[\"Fix Test Code Directly\\n(Keep assertions strict)\"]\n    IsTestCodeBug -->|Production Bug| LogDefect[\"Log Defect in QA/DEFECTS_LOG.md\"]\n    LogDefect --> Triage{\"Triage Blast Radius\"}\n    Triage -->|Minor Fix <= 3 files| DispatchFastTrack[\"Dispatch to Agent 1\\n(Fast-Track Remediation)\"]\n    Triage -->|Architectural / Schema| DispatchTask[\"Dispatch to Agent 1\\n(Create Task in Tasks/bugfix/)\"]\n```\n\n---\n\n## 4. Test Reporting Standard\n\nWhen reporting test results to the user:\n```markdown\n# 🧪 QA Execution Report\n\n- **Target Suite:** [Unit / Integration / E2E]\n- **Command Executed:** \\`[Command]\\`\n- **Duration:** [X seconds]\n- **Results:** [N Passed | M Failed | K Skipped]\n\n### Summary of Failures (if any)\n1. **[Suite / File]** — Description of failure, expected vs actual, reproduction command.\n   - **Logged in:** \\`.tailorai/QA/DEFECTS_LOG.md\\` (Defect ID: DEF-XXX)\n```\n\n","QA/DEFECTS_LOG.md":"# Master Defects & Quality Findings Log 🛡️📋\n\n> **Location:** `.tailorai/QA/DEFECTS_LOG.md`  \n> **Managed By:** Agent 3 (QA Automation Lead)  \n> **Remediated By:** Agent 1 (Lead Developer)\n\n---\n\n## 🔴 Open Defects\n\n| Defect ID | Severity | Module / Flow | Description | Reproduction / Evidence | Status | Assigned Track |\n|---|---|---|---|---|---|---|\n| *DEF-001* | *Example* | *Auth* | *Example defect placeholder* | *Run test:auth* | *Open* | *Fast-Track* |\n\n---\n\n## 🟢 Resolved Defects Archive\n\n| Defect ID | Severity | Module / Flow | Resolution Summary | Fixed in Task / Commit | Verified By |\n|---|---|---|---|---|---|\n| - | - | - | - | - | - |\n\n","QA/TEST_PLAN.md":"# Master Test Plan & Scenario Registry 🧪📊\n\n> **Location:** `.tailorai/QA/TEST_PLAN.md`  \n> **Status Codes:** `⬜ Unverified / Pending Run` | `✅ Passed` | `❌ Failed` | `⚠️ Flaky`\n\n---\n\n## 1. Test Architecture Overview\n\n- **Unit Test Framework:** `{{TEST_FRAMEWORK}}`\n- **Integration Framework:** `{{INTEGRATION_TEST_FRAMEWORK}}`\n- **E2E / Browser Automation:** `{{E2E_FRAMEWORK}}`\n\n---\n\n## 2. Test Suites Matrix\n\n| Module / Feature | Test Type | File Location | Command | Status | Last Run |\n|---|---|---|---|---|---|\n| Core Authentication | Unit / Integration | `tests/unit/AuthTest.*` | `{{TEST_COMMAND}}` | ⬜ | - |\n| API Contracts | Integration | `tests/integration/ApiContractsTest.*` | `{{TEST_COMMAND}}` | ⬜ | - |\n| Critical User Flow | E2E Live Scenario | `tests/e2e/UserJourney.spec.*` | `{{E2E_TEST_COMMAND}}` | ⬜ | - |\n\n---\n\n## 3. Decoupled Test Execution Guidelines\n\n1. **Feature Implementation (Agent 1):** Adds test files matching new code and registers them above with status `⬜`.\n2. **On-Demand Execution (Agent 3):** Executes tests when instructed by the user (`/qa` or manual command) and updates status accordingly.\n\n","README.md":"# Governance & Technical Documentation (`.tailorai/`) 🏛️\n**Project:** `{{PROJECT_NAME}}`\n\nWelcome to the central AI engineering governance, architectural specifications, and task tracking hub. All AI agents and human developers working on the repository follow the guidelines documented here.\n\n> **Companion references (in project root, outside `.tailorai/`):**\n> - **`AGENT_BLUEPRINT.md`** — Architecture knowledge base: *what* the workspace is + *why* it was designed this way. The master reference for structure, decisions, and the placeholder contract.\n> - **`AGENT_STRATEGY.md`** — Operational strategy: *how* the agent behaves + *when* it takes each action. Read this before changing any behavioral rule.\n> - **`init-agent.md`** — Setup protocol (Steps 0-5) used to instantiate or upgrade this workspace.\n\n---\n\n## 🧭 Navigation & Directory Map\n\n```\n.tailorai/\n├── Agent.md                            # Universal AI entry router & critical invariants\n├── HANDBOOK.md                         # Engineering constitution & Dual-Track rules\n├── PROJECT_MAP.md                      # Knowledge base master index & Fast-Track log\n├── ACTIVE_TASKS.md                     # Currently in-progress tasks registry\n├── README.md                           # Documentation index & directory guide\n│\n├── Engineering/                        # Core Engineering Roles & Operational Runbooks\n│   ├── Lead_Developer.md               # Agent 1: Full-stack execution lead\n│   ├── Code_Review.md                  # Agent 2: Code review & compliance auditor\n│   └── Runbooks/                       # Operational execution runbooks\n│       ├── Local_Setup.md              # Local dev environment setup\n│       ├── Commands.md                 # CLI commands reference\n│       ├── Production.md               # Production deployment specifications\n│       └── CI_CD_Pipeline.md           # Continuous integration & deployment\n│\n├── QA/                                 # Decoupled Quality & Testing Project\n│   ├── Agent_Testing.md                # Agent 3: QA Automation Lead\n│   ├── DEFECTS_LOG.md                  # Master defect triage & findings register\n│   └── TEST_PLAN.md                    # Decoupled test matrix & scenario registry\n│\n├── Protocols/                          # Universal Engineering Protocols\n│   ├── API_Contracts.md\n│   ├── Audit_Log_Protocol.md\n│   ├── Deployment_Protocol.md\n│   ├── Environment_Variables_Protocol.md\n│   ├── Git_Workflow.md\n│   ├── I18n_Protocol.md\n│   ├── Security_Protocol.md\n│   ├── Storage_Protocol.md\n│   ├── Testing_Standards.md\n│   ├── Theme_Protocol.md\n│   └── WebSocket_Protocol.md\n│\n├── Architecture/                       # Architecture & Design Specifications\n│   ├── Technical_Architecture.md\n│   ├── PRD.md\n│   ├── Visual_Identity.md\n│   └── Architecture_Questions.md\n│\n├── Skills/                             # Developer Skills & Quality Rules\n│   ├── CleanCode_Skill.md\n│   ├── Code_Review_Skill.md\n│   ├── Designer_Skill.md\n│   ├── Knowledge_Builder_Skill.md\n│   ├── Performance_Skill.md\n│   └── Security_Skill.md\n│\n├── Audits/                             # Automated Verification Prompts\n│   ├── CleanCode_Audit_Prompt.md\n│   ├── Knowledge_Base_Verification.md\n│   ├── Security_Audit_Prompt.md\n│   └── TailorAI_Folder_Audit_Prompt.md\n│\n├── Brand/                              # Brand Assets Template\n│   └── Brand_Guide_Template.md\n│\n└── Tasks/                              # Task Workspaces\n    ├── Task_Template.md\n    ├── backend/\n    ├── frontend/\n    ├── bugfix/\n    ├── feature/\n    ├── refactor/\n    ├── security/\n    └── migration/\n```\n\n---\n\n## ⚡ Fast-Track vs. Full Protocol\n\n| Track | When to Use | Documentation Overhead | Average Time |\n|---|---|---|---|\n| **🚀 Fast-Track** | Bug fixes, utility hooks, UI polish, locale keys (≤ 3 files) | No task file required. Fast syntax check + single line in `PROJECT_MAP.md`. | **< 1 min** |\n| **🛡️ Full Protocol** | New modules, schema migrations, public API endpoints, major flows | Task file in `Tasks/` + atomic execution + test registration in `TEST_PLAN.md`. | **Structured** |\n\n---\n\n## 🛠️ Offline Documentation Explorer\n\nTo compile this documentation into a standalone single-file HTML viewer:\n```bash\nnode scripts/build-explorer.js\n```\nThe compiled explorer will be generated at `.tailorai/index.html`.\n","Skills/CleanCode_Skill.md":"# Skill: Clean Code & Architecture Enforcement (/clean-code)\n\n## Purpose\nEnforce clean code, DRY (Don't Repeat Yourself), KISS (Keep It Simple, Stupid), and Single Responsibility Principles (SRP) across the entire codebase regardless of the target programming language or framework.\n\n## Directives & Best Practices\n\n### 1. Single Responsibility Principle (SRP)\n- **Method / Function Decomposition:** Methods MUST be decomposed into small, single-purpose helper functions under 20 lines. No single function should handle validation, business logic, persistence, and output formatting simultaneously.\n- **Component / View Decomposition:** Presentational components or UI views MUST be decomposed into pure sub-components under 150 lines.\n\n### 2. Elimination of Magic Values & Hardcoding\n- Extract all inline magic numbers, status strings, dropdown lists, and fixed configurations into constants, configuration files, or enums.\n- Use explicit status types/enums (e.g. a typed state value of `idle`, `loading`, `success`, `error`) rather than scattered boolean flags.\n\n### 3. Guard Clauses & Control Flow\n- Use early exit guard clauses instead of deeply nested `if/else` branches.\n- Keep execution paths linear, predictable, and readable.\n\n### 4. Colocation & Separation of Concerns\n- Colocate feature-specific helpers, services, modules, domain logic, or types next to their feature directory.\n- Keep UI views pure and free of direct data-fetching, state manipulation, or complex business logic.\n","Skills/Code_Review_Skill.md":"# Skill: Systematic Code Review (/code-review)\n\n## Purpose\nPerform thorough, objective code reviews to catch bugs, security issues, architectural drift, and maintainability concerns.\n\n## Review Steps\n1. **Architectural Compliance:** Does the change follow the project's layered architecture and domain organization?\n2. **Clean Code & SRP:** Are functions concise (< 20 lines) and components modular (< 150 lines)?\n3. **Security Check:** Is input validated, output sanitized, and authorization enforced?\n4. **Performance Check:** Are there any query bottlenecks, unindexed fields, or memory leaks?\n5. **Test Coverage:** Are unit or integration tests included for the new logic?\n6. **Task Alignment:** Do the changes match the objective described in the task file in `.tailorai/Tasks/`?\n","Skills/Designer_Skill.md":"# Skill: UI/UX & Responsive Design (/design)\n\n## Purpose\nGuide agents in creating polished, modern, accessible, and user-friendly user interfaces across web, mobile, or desktop platforms.\n\n## Directives\n1. **Design Tokens:** Always consume predefined design tokens (`.tailorai/Architecture/Visual_Identity.md`) for colors, typography, and spacing.\n2. **Responsive Layouts:** Design mobile-first layouts that adapt fluidly across mobile, tablet, and desktop viewports.\n3. **User Feedback States:** Always implement clear visual feedback for interactive elements:\n   - Idle / Normal state\n   - Hover / Focus / Active state\n   - Loading / Processing state (skeletons, spinners, progress indicators)\n   - Success / Confirmation feedback\n   - Error / Failure state with clear resolution messaging\n4. **Accessibility (a11y):** Ensure high contrast ratios, proper accessibility semantics, keyboard/gesture navigation, and screen reader compatibility.\n","Skills/Knowledge_Builder_Skill.md":"# Skill: Legacy Knowledge Base Conversion Protocol (Knowledge_Builder_Skill.md)\n\n## Purpose\nThis skill defines the autonomous protocol for reading a legacy agent directory or historical task archives, extracting semantic context, converting tasks to the new standardized format in `.tailorai/Tasks/`, and building the master index in `.tailorai/PROJECT_MAP.md`.\n\n---\n\n## Execution Directives & Protocol\n\n### Step 1: Scan & Archive Backup\n1. Ask the user for the path of the legacy agent/tasks folder if not already specified.\n2. Copy the entire legacy folder into `.tailorai/Archive_Legacy/` so zero historic context is destroyed or lost.\n\n### Step 2: Initialize Migration Queue\nCreate `.tailorai/Tasks/migration/migration_queue.md` listing all files discovered in `.tailorai/Archive_Legacy/`:\n\n```markdown\n# Legacy Migration Queue\n- **Total Files Discovered:** X\n- **Status:** In Progress\n\n## Queue Checklist\n- [ ] `.tailorai/Archive_Legacy/[file_1].md`\n- [ ] `.tailorai/Archive_Legacy/[file_2].md`\n```\n\n### Step 3: Batch Processing Loop (2-3 Files Per Batch)\nIn each iteration:\n1. **Read ONLY 2-3 uncompleted items** `[ ]` from `migration_queue.md`.\n2. **Classify Content Type:**\n   - **Task / Feature / Bugfix:** Extract task name, status (completed `[x]` vs in-progress `[ ]`), category, target files, objective, and implementation details. Create a new task file: `.tailorai/Tasks/[category]/YYYY-MM-DD_[task_slug].md` following `Task_Template.md`.\n   - **Protocol / Guideline:** Extract rule and merge into the appropriate file in `.tailorai/Protocols/`.\n   - **Architecture Document:** Extract system notes and append to `.tailorai/Architecture/Technical_Architecture.md` or `PRD.md`.\n3. **Register in `PROJECT_MAP.md`:**\n   - For completed tasks, add a structured entry under the appropriate category in `.tailorai/PROJECT_MAP.md`.\n4. **Mark Progress:**\n   - Change `[ ]` to `[x]` in `migration_queue.md`.\n5. **Stop & Report:**\n   - Report progress after each batch and prompt the user before starting the next batch.\n\n### Step 4: Resume Capability\nIf execution is interrupted at any point, reopen `migration_queue.md`, locate the first remaining unchecked `[ ]` item, and resume batch processing cleanly.\n\n### Step 5: Final Migration Report\nUpon completing all items in the queue, generate a summary report in `.tailorai/Tasks/migration/migration_report.md` detailing total tasks migrated, categories created, and archived file references.\n","Skills/Performance_Skill.md":"# Skill: Performance Optimization (/performance)\n\n## Purpose\nGuide agents in writing high-performance, resource-efficient code with minimal latency and memory overhead across any technology stack.\n\n## Directives\n\n### 1. Database & Queries\n- Avoid N+1 query problems — use eager loading or batch fetching for relational queries.\n- Ensure proper database indexing on foreign keys, search fields, and frequently filtered columns.\n- Select only required fields rather than wildcard `SELECT *` on large data tables.\n\n### 2. View / Resource Loading & Assets\n- Implement lazy loading or asynchronous loading for non-critical dependencies and heavy modules.\n- Memoize or cache expensive calculations in memory.\n- Optimize media assets and network payloads for bandwidth efficiency.\n\n### 3. Caching & Memory Management\n- Cache static or infrequently changing data using appropriate caching stores or HTTP headers.\n- Clean up side effects, background listeners, or unmanaged resources to prevent memory leaks.\n","Skills/Security_Skill.md":"# Skill: Security & Data Protection (/security)\n\n## Purpose\nGuide agents in writing secure code, preventing vulnerabilities, and adhering to universal OWASP security principles across any technology stack.\n\n## Directives & Audit Checklist\n\n### 1. Input Validation & Boundaries\n- Validate all incoming user data against strict type definitions, schemas, or framework validators before processing.\n- Never trust client-side data or assumptions. Enforce server-side checks.\n\n### 2. Authorization & Tenant Isolation\n- Check user identity and permissions explicitly before executing any sensitive action.\n- In multi-tenant environments, verify that every query filters data by tenant ID to prevent cross-tenant data leaks.\n\n### 3. Vulnerability Evasion\n- **SQL / Query Injection:** Always use parameterized queries or ORM bindings. Never concatenate un-sanitized strings into raw database queries.\n- **XSS (Cross-Site Scripting):** Escape output rendered in templates or UI views. Sanitize user-generated content.\n- **CSRF & Rate Limiting:** Enforce CSRF tokens on state-changing requests and apply rate limits to sensitive routes.\n","Tasks/Task_Template.md":"# Task: [Clear Task Name]\n- **Date:** [YYYY-MM-DD]\n- **Category:** [feature/bugfix/refactor/backend/frontend/security/migration]\n- **Target Files:** [List of main files involved]\n\n## 1. Objective\n[Brief description of the feature, bug fix, or refactoring goal]\n\n## 2. Atomic Execution Steps\n- [ ] [Step 1: Planning / File creation]\n- [ ] [Step 2: Implementation]\n- [ ] [Step 3: Verification & Tests]\n\n## 3. Implementation Reality & Audit Log\n[Record of actual code changes made, API routes updated, DB schema modifications, and test results. This section is updated sequentially as sub-tasks are completed]\n"};
    let activePath = '';

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      document.documentElement.classList.toggle('light');
    }

    function renderTree(nodes, container) {
      container.innerHTML = '';
      nodes.forEach(node => {
        if (node.type === 'directory') {
          const dirDiv = document.createElement('div');
          dirDiv.className = 'tree-node';
          dirDiv.innerHTML = `<div class="tree-dir-title">📁 ${node.name}</div><div class="tree-dir-children" style="padding-left:8px;"></div>`;
          renderTree(node.children, dirDiv.querySelector('.tree-dir-children'));
          container.appendChild(dirDiv);
        } else {
          const fileA = document.createElement('div');
          fileA.className = 'tree-file' + (node.path === activePath ? ' active' : '');
          fileA.innerHTML = `📄 ${node.name}`;
          fileA.onclick = () => loadDoc(node.path);
          container.appendChild(fileA);
        }
      });
    }

    function loadDoc(path) {
      activePath = path;
      document.getElementById('activePath').textContent = '.tailorai/' + path;
      const content = DOCS_DATA[path] || '# Document Not Found';
      
      marked.setOptions({
        highlight: function(code, lang) {
          const language = hljs.getLanguage(lang) ? lang : 'plaintext';
          return hljs.highlight(code, { language }).value;
        },
        gfm: true,
        breaks: true
      });

      document.getElementById('contentArea').innerHTML = marked.parse(content);
      renderTree(FILE_TREE, document.getElementById('treeContainer'));
    }

    function copyMarkdown() {
      if (activePath && DOCS_DATA[activePath]) {
        navigator.clipboard.writeText(DOCS_DATA[activePath]);
        alert('Copied markdown to clipboard!');
      }
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      if (!q) {
        renderTree(FILE_TREE, document.getElementById('treeContainer'));
        return;
      }
      const matches = Object.keys(DOCS_DATA).filter(p => p.toLowerCase().includes(q) || DOCS_DATA[p].toLowerCase().includes(q));
      const container = document.getElementById('treeContainer');
      container.innerHTML = '';
      matches.forEach(p => {
        const item = document.createElement('div');
        item.className = 'tree-file';
        item.innerHTML = `🔍 ${p}`;
        item.onclick = () => loadDoc(p);
        container.appendChild(item);
      });
    }

    if (DOCS_DATA['README.md']) {
      loadDoc('README.md');
    } else if (Object.keys(DOCS_DATA).length > 0) {
      loadDoc(Object.keys(DOCS_DATA)[0]);
    }
  </script>
