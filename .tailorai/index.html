    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background: var(--bg-body); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
    
    #sidebar { width: 320px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .brand { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .theme-toggle { background: transparent; border: 1px solid var(--border); color: var(--text-main); padding: 4px 8px; border-radius: 6px; cursor: pointer; }
    
    .search-box { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .search-input { width: 100%; background: var(--bg-body); border: 1px solid var(--border); border-radius: 6px; color: var(--text-main); padding: 8px 12px; font-size: 13px; font-family: var(--font-sans); outline: none; }
    .search-input:focus { border-color: var(--primary); }

    .tree-container { flex: 1; overflow-y: auto; padding: 12px 8px; }
    .tree-node { margin: 2px 0; }
    .tree-dir-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); padding: 8px 12px; border-radius: 4px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .tree-dir-title:hover { background: var(--bg-hover); color: var(--text-main); }
    .tree-file { font-size: 13px; padding: 6px 12px 6px 28px; border-radius: 4px; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; gap: 6px; text-decoration: none; }
    .tree-file:hover { background: var(--bg-hover); color: var(--text-main); }
    .tree-file.active { background: var(--primary); color: #ffffff; font-weight: 500; }

    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-body); }
    .top-bar { padding: 14px 28px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-family: var(--font-mono); color: var(--text-muted); }
    .doc-viewer { flex: 1; overflow-y: auto; padding: 40px 48px; }
    .markdown-body { max-width: 920px; margin: 0 auto; line-height: 1.7; font-size: 15px; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin-top: 1.5em; margin-bottom: 0.6em; color: var(--text-main); }
    .markdown-body h1 { font-size: 28px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .markdown-body h2 { font-size: 22px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .markdown-body p, .markdown-body ul, .markdown-body ol { margin-bottom: 1.2em; }
    .markdown-body code { font-family: var(--font-mono); font-size: 0.9em; background: var(--bg-card); padding: 2px 6px; border-radius: 4px; }
    .markdown-body pre code { display: block; padding: 16px; overflow-x: auto; background: #0f172a; border-radius: 8px; }
    .markdown-body table { width: 100%; border-collapse: collapse; margin-bottom: 1.5em; }
    .markdown-body th, .markdown-body td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
    .markdown-body th { background: var(--bg-card); }
    .markdown-body blockquote { border-left: 4px solid var(--primary); padding-left: 16px; color: var(--text-muted); margin-bottom: 1.2em; }
  </style>
</head>

    const DOCS_DATA = {"ACTIVE_TASKS.md":"# Active Tasks (In Progress)\n\n> Tasks currently being worked on. When a task is fully completed and confirmed by the user, move it to `PROJECT_MAP.md` and remove it from here.\n\n## In Progress\n*(No active tasks currently)*\n<!-- Example: - [ ] `.tailorai/Tasks/feature/2026-08-12_user_authentication.md` -->\n\n## Recently Completed (Pending Archive Confirmation)\n*(None)*\n","Agent.md":"# Master AI Instruction Protocol & Router (Agent.md) 🏛️💻\n\n> [!NOTE]\n> **Universal Entry Router:** This file is the primary agent-facing runtime constitution. It is compatible with all AI tools (Cursor `.cursorrules`, Windsurf `.windsurfrules`, Claude Code `CLAUDE.md`, and Google Antigravity).\n> **Detailed Constitutions:** Comprehensive rules live in [`.tailorai/HANDBOOK.md`](HANDBOOK.md), [`.tailorai/Engineering/Lead_Developer.md`](Engineering/Lead_Developer.md), and [`.tailorai/QA/Agent_Testing.md`](QA/Agent_Testing.md).\n\n---\n\n## 1. Core Identity & Specialized Roles\n\nYou are the **Technical Lead & Autonomous Engineering Agent** for **{{PROJECT_NAME}}**.\n- **Tech Stack:** {{TECH_STACK}}\n- **Architecture Standard:** Clean modular architecture adhering to [`.tailorai/HANDBOOK.md`](HANDBOOK.md).\n\nDepending on user intent, you assume one of three specialized engineering personas:\n1. **Lead Developer (Agent 1):** Code implementation, refactoring, and Fast-Track surgical fixes. → [`.tailorai/Engineering/Lead_Developer.md`](Engineering/Lead_Developer.md)\n2. **Code Reviewer (Agent 2):** Architecture compliance, SRP verification, and diff auditing. → [`.tailorai/Engineering/Code_Review.md`](Engineering/Code_Review.md)\n3. **QA Automation Lead (Agent 3):** On-demand test execution, live browser scenarios, and defect logging. → [`.tailorai/QA/Agent_Testing.md`](QA/Agent_Testing.md)\n\n---\n\n## 2. The 10 Critical Engineering Rules (Never Violate)\n\n*Priority Tiers: If context constraints ever force trade-offs, NEVER sacrifice a `[P0]` rule. Sacrifice `[P1]` before `[P0]`.*\n\n1. **[P0] NO LOGIC IN VIEW TEMPLATES:** Views and components (`.tsx`, `.vue`, `.blade.php`) must contain zero direct business logic, raw API calls, or complicated state mutations. Delegate all logic to colocated hooks, service classes, or view-models.\n2. **[P0] NO HARDCODED STRINGS:** No raw user-facing text in templates. Use internationalization lookup functions (`t('key', 'Fallback')`) with 100% key parity across all supported project locales.\n3. **[P0] RTL/LTR DIRECTION COMPLIANCE:** Use CSS logical properties (`ps-*`, `pe-*`, `start-*`, `end-*`, `margin-inline-start`, etc.). Never hardcode physical directions (`left: 10px`, `text-align: right`) without directional variants.\n4. **[P0] DESIGN SYSTEM TOKENS ONLY:** Always use defined design tokens, theme CSS variables, and utility classes. Never hardcode arbitrary hex colors or raw pixel measurements.\n5. **[P1] DOMAIN-DRIVEN CO-LOCATION:** Group components and backend logic by feature domain with colocated hooks, constants, and types. Avoid generic dumping-ground folders (`components/misc`, `helpers/utils`).\n6. **[P1] UNIVERSAL ANTI-BOT & INPUT SANITIZATION:** All public forms and ingestion endpoints must enforce anti-bot protection (PoW token, honeypot traps, speed guards) and strict input schema validation.\n7. **[P1] SRP METHOD DECOMPOSITION (BACKEND):** Controllers, actions, and service classes must decompose monolithic logic into small, single-responsibility `private` helper methods (< 15–20 lines each).\n8. **[P1] SRP UI COMPONENT COMPOSITION & CONSTANTS (FRONTEND):** Presentational views must be decomposed into small sub-components (< 150 lines). Extract static dropdowns, options, and tables into colocated `constants/` files. Replace scattered booleans with unified state unions (`'idle' | 'loading' | 'submitting' | 'success' | 'error'`).\n9. **[P0] DECOUPLED ON-DEMAND TESTING:** The AI **MUST write** unit, integration, and E2E test files with status `⬜`, but **NEVER run them automatically** during task execution or code modifications. Tests run exclusively on explicit human command or dedicated CI runs.\n10. **[P0] STOP ON AMBIGUITY — NEVER IMPROVISE:** If you encounter contradictions between documentation, ambiguous schema types, or multiple conflicting paths, **STOP immediately** and ask the user before continuing.\n\n---\n\n## 3. Dual-Track Execution Engine\n\n### Track A: 🚀 Fast-Track (Immediate Execution — No Task File)\n* **Trigger:** Routine, low-risk changes modifying **≤ 3 files** (bug fixes, utility functions, UI polish, locale keys).\n* **Workflow:**\n  1. Apply surgical fix directly.\n  2. Run quick syntax/type check (`{{TYPE_CHECK_COMMAND}}`).\n  3. Append single-line log under `## Fast-Track History` in `.tailorai/PROJECT_MAP.md`:\n     `- [YYYY-MM-DD] [fix/polish]: description (N files)`\n  4. Present completed changes to user (< 1 min target).\n* **Boundary:** Fast-Track is **strictly forbidden** for database migrations, auth/security middleware, or breaking API contracts.\n\n### Track B: 🛡️ Full Protocol (Architectural Changes & Features)\n* **Trigger:** New modules, database migrations, public API endpoints, major screen flows.\n* **Workflow:** Create task file in `.tailorai/Tasks/[category]/YYYY-MM-DD_[slug].md` → Register in `.tailorai/ACTIVE_TASKS.md` → Execute atomically step-by-step → Register tests with `⬜` in `TEST_PLAN.md` → Verify → Archive in `.tailorai/PROJECT_MAP.md`.\n\n---\n\n## 4. Context Router (MANDATORY — Read ONLY What You Need)\n\n> [!CAUTION]\n> **NEVER read all documentation at once.** Follow this lazy-loading flow:\n> 1. Check `.tailorai/ACTIVE_TASKS.md` for in-progress work.\n> 2. Read `PROJECT_MAP.md` only when searching for existing features or completed task history.\n> 3. Read specific protocol files in `.tailorai/Protocols/` only when implementing features in that domain (e.g., read `Storage_Protocol.md` only when uploading files).\n> 4. Keep active context under 2–3 files per turn.\n\n---\n\n## 5. Skills & Command Dispatch Table\n\n| Command | Persona / Skill | Target Location |\n|---|---|---|\n| `/qa` or `run tests` | QA Automation Lead | `.tailorai/QA/Agent_Testing.md` |\n| `/review` or `audit code` | Code Reviewer | `.tailorai/Engineering/Code_Review.md` |\n| `/clean-code` | Clean Code Specialist | `.tailorai/Skills/CleanCode_Skill.md` |\n| `/security` | Security Auditor | `.tailorai/Skills/Security_Skill.md` |\n| `/performance` | Performance Profiler | `.tailorai/Skills/Performance_Skill.md` |\n| `/explorer` | Offline Docs Builder | `node scripts/build-explorer.js` |\n","Architecture/Architecture_Questions.md":"# Architecture Questions — Helper Guide for {{PROJECT_NAME}}\n\n> **Helper Document:** Use the questions below to gather information for populating:\n> - `Technical_Architecture.md`\n> - `PRD.md`\n> - `Visual_Identity.md`\n>\n> Sections 4–6 below additionally feed the operational protocol files (`Security_Protocol.md`, `Deployment_Protocol.md`, `Testing_Standards.md`) — those tokens are auto-populated in Step 1 where detectable, but the questions help confirm them during Step 2.\n>\n> You can answer these manually or prompt the AI Agent to help construct the architecture files based on your answers.\n\n---\n\n## 1. Technical Architecture\n> Feeds: `Technical_Architecture.md`\n\n### 1.1 Tech Stack\n- What is the Backend Framework? (Laravel, Django, Express.js, Go, .NET, Rails, etc.)\n- What is the Frontend Framework? (Next.js, Vue, React, Flutter, Angular, None, etc.)\n- What is the Database? (PostgreSQL, MySQL, MongoDB, SQLite, etc.)\n- What is the Cache/Queue System? (Redis, RabbitMQ, SQS, etc. — if applicable)\n- What is the Storage/CDN? (S3, R2, Cloudinary, Local, etc. — if applicable)\n- What is the Auth mechanism? (JWT, Session cookies, OAuth2, etc.)\n\n### 1.2 Architectural Patterns\n- What is the overall architecture pattern? (Monolith, Modular Monolith, Microservices, Serverless, etc.)\n- What key design patterns are used? (MVC, HMVC, Clean Architecture, Domain-Driven Design, Repository+Service, CQRS, etc.)\n- Is there a specific domain/feature module organization?\n- What is the main directory layout? (Sketch a high-level tree)\n\n### 1.3 Communication & APIs\n- What API paradigm is used? (REST, GraphQL, gRPC, tRPC, etc.)\n- Are WebSockets or real-time event systems present?\n- What external third-party APIs are integrated?\n\n### 1.4 Database Schema & Data Model\n- What are the key database tables/collections and their relationships? (List core entities + cardinality, e.g. User 1—N Orders)\n- Are there any polymorphic, multi-tenant, or soft-delete patterns in the schema?\n\n---\n\n## 2. Product Requirements Document (PRD)\n> Feeds: `PRD.md`\n\n### 2.1 Product Overview\n- What is the product? (Clear one-sentence summary)\n- What primary problem does it solve?\n- Who is the target audience?\n\n### 2.2 Roles & Permissions\n- What are the user roles? (Admin, User, Doctor, Staff, etc.)\n- What permissions apply to each role?\n- Is there a Multi-tenancy architecture? (SaaS / Standalone / Both)\n\n### 2.3 Core Modules\n- What are the primary feature modules?\n  - Example: Authentication, Dashboard, Billing, Users, Reports, Settings\n- Which modules are completed versus pending development?\n\n### 2.4 Primary User Journeys\n- What are the top 3 user journeys?\n  - Example: Registration → Onboarding / Account Setup → Daily Core Usage\n\n### 2.5 Capacity & Non-Functional Requirements\n- What are the expected scale targets? (Concurrent users, requests/sec, data volume, retention)\n- What are the non-functional requirements across:\n  - **Performance** (latency budgets, page-load targets)\n  - **Security** (compliance standards: GDPR, HIPAA, PCI, etc., if applicable)\n  - **Accessibility** (WCAG level targeted, RTL/LTR, screen-reader support)\n  - **Scalability** (horizontal vs vertical, expected growth)\n\n---\n\n## 3. Visual Identity & Design Tokens\n> Feeds: `Visual_Identity.md`\n\n### 3.1 Color System\n- Primary Color?\n- Secondary Color?\n- Accent Color? (for success / positive feedback states)\n- Danger Color? (for errors, destructive actions)\n- Background Color?\n- Surface / Container Color?\n- Is Dark Mode supported? (If yes, provide the dark-mode equivalents of the colors above; if no, state \"Single theme only\" so the token is flagged rather than invented.)\n\n### 3.2 Typography\n- What font family is used? (Inter, Roboto, System UI, etc.)\n- What is the Heading scale / ratio? (e.g. 1.25 major third, or list each heading size)\n- What is the Body scale / base font size? (e.g. 16px base with 1.125 ratio)\n- Is RTL/Multilingual layout required? (This populates `{{LAYOUT_DIRECTION}}` — LTR / RTL / Multilingual)\n\n### 3.3 Spacing & Geometry\n- What spacing grid baseline is used? (e.g. 4px / 8px base unit)\n- What border radius scale applies? (e.g. sharp / 4px / 8px / pill)\n- Is a Design System or CSS Token set defined? (If yes, where is it stored so tokens can be auto-detected?)\n\n---\n\n## 4. Localization & i18n\n> Feeds: `Security_Protocol.md` validation scope + `Visual_Identity.md` direction token\n\n- What locales are supported?\n- How is localization key parity managed?\n\n---\n\n## 5. Security\n> Feeds: `Security_Protocol.md`\n\n- What authentication mechanism is enforced? (JWT, Session, OAuth, etc.)\n- What authorization model applies? (RBAC, ABAC?)\n- Is this multi-tenant? If yes, how is tenant isolation enforced? If single-tenant, state \"N/A — single-tenant\" so the `{{TENANT_ISOLATION_SPEC}}` token is flagged rather than left ambiguous.\n- What input validation engine is used? (e.g. Zod, Pydantic, FormRequests, DTOs/Schemas)\n- Are rate limits or anti-bot protections required?\n\n---\n\n## 6. DevOps & Execution\n> Feeds: `Deployment_Protocol.md` + `Testing_Standards.md`\n\n- What is the deployment environment? (Docker, VPS, Vercel, AWS, etc.)\n- What command runs the local dev server?\n- What command runs the test suite?\n- What command runs type checking? (And linting, if separate/combined)\n- What is the staging deploy process?\n- What is the production deploy process?\n","Architecture/PRD.md":"# Product Requirements Document (PRD) — {{PROJECT_NAME}}\n\n## 1. Executive Summary\n<!-- What does {{PROJECT_NAME}} do? One paragraph describing the core value proposition. -->\n\n## 2. Target Users & Roles\n| Role | Description | Key Permissions |\n|------|-------------|-----------------|\n| Admin | | |\n| User | | |\n\n## 3. Core Modules & Scope\n<!-- List each module with its status -->\n| # | Module | Status | Description |\n|---|--------|--------|-------------|\n| 1 | Authentication | | |\n| 2 | Dashboard | | |\n| 3 | | | |\n\n## 4. User Journeys\n### Journey 1: [Name]\n<!-- Step-by-step flow of the primary user journey -->\n\n### Journey 2: [Name]\n<!-- Step-by-step flow of the secondary user journey -->\n\n## 5. Capacity & Limits (if applicable)\n<!-- Any resource limits, quotas, or tier-based restrictions -->\n\n## 6. Non-Functional Requirements\n- **Performance:** \n- **Security:** \n- **Accessibility:** \n- **Scalability:** \n","Architecture/PRD_TailorAI_DevLead.md":"# Product Requirements Document (PRD) — TailorAI-DevLead Console 💻⚡\n### Autonomous AI Developer Cockpit & CLI Execution Console\n\n**Platform:** Cybeasy TailorAI-DevLead Platform  \n**Document Code:** `PRD-TAILORAI-DEVLEAD-001`  \n**Status:** Approved Architecture Blueprint 🚀  \n**Target Audience:** Software Developers, Technical Leads & QA Engineers  \n**Architecture Mode:** Standalone Local Micro-Dashboard (Port `3020`)  \n**Advisory Intelligence Provider:** Google Gemini API  \n\n---\n\n## 1. Problem Statement & Motivation\n\nAs modern software projects scale in complexity, managing engineering tasks, architectural compliance, and testing lifecycles through manual terminal commands creates developer friction:\n\n1. **Terminal & Context Switching Friction:** Engaging specialized roles currently requires manually locating and referencing markdown files (e.g., `Lead_Developer.md`, `Code_Review.md`, `Agent_Testing.md`), remembering exact prompt syntax, and interpreting raw shell output.\n2. **The Generic Chat Trap:** Off-the-shelf chatbot interfaces (ChatGPT, Open-WebUI) operate purely as theoretical advisors. They lack access to local project files, cannot run unit or E2E tests, cannot modify code, and cannot perform git operations in the repository.\n3. **The Need for TailorAI-DevLead Console:** An ultra-lightweight, standalone Web Dashboard running locally on port `3020` that gives developers a **dedicated engineering cockpit**:\n   - Direct channels for **Lead Developer (Agent 1)**, **Code Reviewer (Agent 2)**, and **QA Automation Lead (Agent 3)**.\n   - Built-in terminal panel with real-time CLI subprocess streaming (`tsc --noEmit`, `php -l`, test execution, git status).\n   - Fast-Track indicator for micro-changes (≤ 3 files) with automated syntax/type checks.\n   - Zero heavy container dependencies (< 60 MB RAM, instant startup).\n\n---\n\n## 2. Core Developer Roles (Channels)\n\n| Channel | Persona | Target Responsibilities | Execution Mode |\n|---|---|---|---|\n| **💻 Lead Developer** | Full-Stack Execution Lead (Agent 1) | Code implementation, refactoring, atomic task execution, and Fast-Track surgical fixes | CLI Execution & Code Writing |\n| **🔍 Code Reviewer** | Architecture & Quality Auditor (Agent 2) | Static analysis, SRP adherence, security audits, and diff review | Advisory & Verification |\n| **🧪 QA Lead** | QA Automation Lead (Agent 3) | Running unit/regression/live E2E test suites, headed browser tests, and managing `DEFECTS_LOG.md` | CLI Execution & Test Runner |\n\n---\n\n## 3. System Architecture\n\n```mermaid\nflowchart TD\n    subgraph Browser [\"Developer Interface (http://localhost:3020)\"]\n        Sidebar[\"💻 Engineering Roles\\n(Lead Dev, Code Review, QA Lead)\"]\n        ChatArea[\"💬 Interactive Chat Stream\"]\n        ExecPanel[\"⚡ Collapsible CLI Execution & Diff Terminal\"]\n        RunbooksMenu[\"📖 Quick Operational Runbooks\"]\n    end\n\n    subgraph Server [\"TailorAI-DevLead Standalone Engine (Port 3020)\"]\n        Scanner[\"🔍 Agent Scanner (.tailorai/Engineering/ & .tailorai/QA/)\"]\n        ContextBinder[\"📑 Silent Context Injector (HANDBOOK.md + Protocols)\"]\n        SubprocessRunner[\"🖥️ Workspace PTY / Child Process Runner\"]\n        SafeGuards[\"🛡️ Fast-Track Guards (Syntax & Type Verification)\"]\n        GitTracker[\"📦 Git Branch & Diff Watcher\"]\n    end\n\n    Sidebar -->|Select Role| ContextBinder\n    ChatArea -->|Prompt / Instruction| ContextBinder\n    ContextBinder --> SubprocessRunner\n    SubprocessRunner -->|Stream stdout/stderr| ExecPanel\n    SafeGuards --> ExecPanel\n    GitTracker --> ExecPanel\n```\n\n---\n\n## 4. Dual-Track Execution Integration\n\nWhen instructing the **Lead Developer**:\n1. If the request modifies ≤ 3 files and does not touch migrations, auth, or public API contracts:\n   - The console marks the turn as **🚀 Fast-Track**.\n   - Executes surgical changes directly in the workspace.\n   - Automatically runs non-destructive syntax checks (`php -l`, `tsc --noEmit`, etc.).\n   - Displays git diff preview in the terminal panel.\n   - Appends a single-line log to `PROJECT_MAP.md`.\n2. If the request touches architectural boundaries:\n   - The console enforces **🛡️ Full Protocol**, generating or updating the appropriate task file in `.tailorai/Tasks/`.\n\n---\n\n## 5. Verification & Acceptance Criteria\n\n1. **Pure Developer Focus:** Zero marketing, finance, sales, or business channels. 100% focused on code, tests, and architecture.\n2. **Resource Constraint:** Node.js memory footprint < 60 MB.\n3. **Execution Safety:** Post-edit syntax/type check automatically runs on every file modification.\n\n","Architecture/Technical_Architecture.md":"# Technical Architecture Overview — {{PROJECT_NAME}}\n\n## 1. Tech Stack\n| Layer | Technology | Version |\n|-------|-----------|---------|\n| Backend | {{BACKEND_FRAMEWORK}} | |\n| Frontend | {{FRONTEND_FRAMEWORK}} | |\n| Database | {{DATABASE}} | |\n| Cache/Queue | | |\n| Storage | | |\n| Auth | | |\n\n## 2. Architecture Pattern\n<!-- Monolith / Modular Monolith / Microservices / Serverless -->\n\n## 3. Directory Structure\n```text\nproject-root/\n├── ...\n└── .tailorai/\n```\n\n## 4. Key Design Patterns\n<!-- List the main patterns used: MVC, HMVC, Clean Architecture, Domain-Driven, etc. -->\n\n## 5. API Design\n<!-- REST / GraphQL / gRPC — with base URL and versioning strategy -->\n\n## 6. Database Schema (Key Tables/Collections)\n<!-- List the main entities and their relationships -->\n\n## 7. External Services & Integrations\n<!-- Payment gateways, email services, storage providers, etc. -->\n","Architecture/Visual_Identity.md":"# Visual Identity & Design System — {{PROJECT_NAME}}\n\n> **Agent Directive:** Populate the values below automatically based on project inspection (CSS custom properties / design-token config / utility-framework config) or via manual configuration. If a value cannot be auto-detected, **leave the token in place and flag it for manual completion** in Step 2 — never invent a value.\n\n## 1. Color Palette & CSS Tokens\n| Token / Name | Hex / Value | Usage |\n|--------------|-------------|-------|\n| Primary | {{COLOR_PRIMARY}} | Dominant brand elements, primary CTAs, main text |\n| Secondary | {{COLOR_SECONDARY}} | Interactive highlights, links, active states |\n| Accent | {{COLOR_ACCENT}} | Success states, positive feedback |\n| Danger | {{COLOR_DANGER}} | Errors, warnings, destructive actions |\n| Background | {{COLOR_BG}} | Page body background |\n| Surface / Card | {{COLOR_SURFACE}} | Container elements, modals, cards |\n\n## 2. Typography\n- **Font Family:** {{FONT_FAMILY}}\n- **Heading Scale:** {{HEADING_SCALE}}\n- **Body Scale:** {{BODY_SCALE}}\n- **Direction:** {{LAYOUT_DIRECTION}} <!-- LTR / RTL / Multilingual -->\n\n## 3. Spacing & Grid System\n- **Grid Baseline:** {{GRID_BASELINE}}\n- **Border Radius Scale:** {{BORDER_RADIUS_SCALE}}\n\n## 4. UI Components Guidelines\n- All presentation elements MUST use predefined design tokens / CSS variables specified in this project.\n- Maintain contrast ratio compliance across text and interactive surfaces.\n- Micro-interactions, hover states, and loading states MUST be defined for interactive components.\n","Architecture/tailorai_devlead_enterprise_os.md":"# RFC: TailorAI-DevLead Enterprise OS Architecture Migration\n\n* **Author:** khaled\n* **Date:** 2026-11-07\n* **Status:** Published RFC for Feedback 🚀\n* **Project:** TailorAI-DevLead\n\n---\n\n## Overview\n\nThis RFC standardizes the engineering, quality assurance, and execution innovations developed in production into the master `TailorAI-DevLead` repository. All non-engineering business layers (marketing, sales, and accounting) have been intentionally removed. The platform is dedicated exclusively to software developers and engineers: acting as an autonomous **Technical Lead (Agent 1)**, an architectural **Code Reviewer (Agent 2)**, and a **QA Automation & Test Lifecycle Lead (Agent 3)**.\n\n---\n\n## Core Engineering Architecture\n\n```\nTailorAI-DevLead/\n├── AGENT_BLUEPRINT.md                    # Technical architecture & knowledge base\n├── AGENT_STRATEGY.md                     # Operational behavior, Dual-Track decision tree & QA model\n├── init-agent.md                         # Setup protocol (Steps 0-5) with upgrade path\n├── scripts/\n│   └── build-explorer.js                 # Standalone offline doc generator (< 100KB)\n├── docs/\n│   └── architecture/\n│       └── PRD_TailorAI_DevLead.md       # DevLead console PRD (focused on Dev/QA/Terminal)\n│\n└── .tailorai/                            # Distributable Governance Workspace Template\n    ├── Agent.md                          # Universal entry router & critical invariants (Cursor, Windsurf, Claude Code, Antigravity)\n    ├── HANDBOOK.md                       # Engineering Constitution, Dual-Track Engine & Core Invariants\n    ├── ACTIVE_TASKS.md                   # In-progress task registry\n    ├── PROJECT_MAP.md                    # Cumulative project index with Fast-Track history\n    ├── README.md                         # Navigation & directory map\n    │\n    ├── Engineering/                      # Core Engineering Roles & Operational Runbooks\n    │   ├── Lead_Developer.md             # Agent 1: Full-stack execution lead\n    │   ├── Code_Review.md                # Agent 2: Architecture & compliance auditor\n    │   └── Runbooks/                     # Operational guides\n    │       ├── Local_Setup.md            # Local dev environment setup\n    │       ├── Commands.md               # CLI commands reference\n    │       ├── Production.md             # Production deployment & ops\n    │       └── CI_CD_Pipeline.md         # Automated CI/CD pipeline\n    │\n    ├── QA/                               # Decoupled On-Demand Quality Model\n    │   ├── Agent_Testing.md              # Agent 3: QA Automation & Test Lifecycle Lead\n    │   ├── DEFECTS_LOG.md                # Structured defect triage & findings log\n    │   └── TEST_PLAN.md                  # Test registry & operational scenario plan\n    │\n    ├── Protocols/                        # Standardized Universal Protocols\n    │   ├── API_Contracts.md              # REST/RPC response shapes & error standards\n    │   ├── Audit_Log_Protocol.md         # Structured security & mutation audit trail\n    │   ├── Deployment_Protocol.md        # Zero-downtime deploy & rollback rules\n    │   ├── Environment_Variables_Protocol.md # Env schema validation & secrets safety\n    │   ├── Git_Workflow.md               # Branch naming, conventional commits & PR standards\n    │   ├── I18n_Protocol.md              # Locale key parity & RTL/LTR logical properties\n    │   ├── Security_Protocol.md          # Auth, tenancy, injection & anti-bot guards\n    │   ├── Storage_Protocol.md           # Secure uploads, MIME checks & storage adapters\n    │   ├── Testing_Standards.md          # Unit, integration & live scenario standards\n    │   ├── Theme_Protocol.md             # CSS variables, tokens & theme persistence\n    │   └── WebSocket_Protocol.md         # Real-time event schemas & socket rules\n    │\n    ├── Architecture/                     # Project Architecture Specifications (Templates)\n    │   ├── Architecture_Questions.md     # Setup questionnaire\n    │   ├── Technical_Architecture.md     # Stack, data layer & folder topology\n    │   ├── PRD.md                        # Product requirements template\n    │   └── Visual_Identity.md            # Design system & tokens template\n    │\n    ├── Skills/                           # Specialized Developer Skills\n    │   ├── CleanCode_Skill.md            # SRP, naming & code smells\n    │   ├── Code_Review_Skill.md          # Multi-lens review methodology\n    │   ├── Designer_Skill.md             # UI/UX engineering & accessibility\n    │   ├── Knowledge_Builder_Skill.md    # Legacy task migration protocol\n    │   ├── Performance_Skill.md          # Profiling & bottleneck mitigation\n    │   └── Security_Skill.md             # Vulnerability prevention\n    │\n    ├── Audits/                           # Automated Verification Prompts\n    │   ├── CleanCode_Audit_Prompt.md\n    │   ├── Knowledge_Base_Verification.md\n    │   ├── Security_Audit_Prompt.md\n    │   └── TailorAI_Folder_Audit_Prompt.md\n    │\n    ├── Brand/                            # Visual assets template\n    │   └── Brand_Guide_Template.md\n    │\n    └── Tasks/                            # Task workspace\n        ├── Task_Template.md\n        ├── backend/\n        ├── frontend/\n        ├── bugfix/\n        ├── feature/\n        ├── refactor/\n        ├── security/\n        └── migration/\n```\n\n---\n\n## Detailed Architectural Mechanisms\n\n### 1. Dual-Track Execution Engine (Fast-Track vs. Full Protocol)\nEliminates documentation latency for small modifications while maintaining strict governance for architectural changes:\n* **🚀 Fast-Track (≤ 3 files):**\n  - **Triggers:** Surgical bug fixes, utility hooks, UI polish, locale keys.\n  - **Rules:** No task file required in `Tasks/`. Direct code edit → Fast syntax/type check (`php -l`, `tsc --noEmit`, etc.) → Single-line log under `## Fast-Track History` in `PROJECT_MAP.md` → Commit. Execution time: < 1 min.\n  - **Strict Negative Boundary:** Fast-Track is strictly forbidden for database migrations, auth/security middleware, public API contract breaks, or new entity schemas.\n* **🛡️ Full Protocol (Architectural Changes):**\n  - **Triggers:** New modules, schema changes, new public endpoints, complete UI flows.\n  - **Rules:** Task file in `Tasks/[category]/YYYY-MM-DD_slug.md` → Register in `ACTIVE_TASKS.md` → Atomic execution with verification → Archive in `PROJECT_MAP.md`.\n\n### 2. Decoupled 100% On-Demand QA Testing Model\n* **The Problem:** Running slow E2E or unit suites on every code modification degrades agent velocity.\n* **The Solution:**\n  - **Lead Developer (Agent 1):** Writes test files with status `⬜`, but never runs heavy suites automatically during development.\n  - **QA Lead (Agent 3 - `Agent_Testing.md`):** A dedicated testing persona responsible for running test suites, headed interactive E2E scenarios, and logging defects into `DEFECTS_LOG.md`.\n  - Tests run exclusively on explicit human command (`/qa` or dedicated test commands).\n\n### 3. Universal IDE & Agent Compatibility\n* `.tailorai/Agent.md` remains in the root of `.tailorai/`.\n* It inlines the 10 Critical Engineering Rules directly so tools like Cursor, Windsurf, Claude Code, and Antigravity inherit strict constraints on turn 1.\n* It routes tasks between:\n  - Lead Developer (`Engineering/Lead_Developer.md`)\n  - Code Reviewer (`Engineering/Code_Review.md`)\n  - QA Automation (`QA/Agent_Testing.md`)\n\n### 4. TailorAI-DevLead Console PRD\n* Documented in `.tailorai/Architecture/PRD_TailorAI_DevLead.md`.\n* Focuses exclusively on Developer Cockpit features: Channels for Lead Dev, Code Review, and QA Lead, connected to a live subprocess terminal panel and Git status tracker.\n\n### 5. Offline Documentation Explorer (`scripts/build-explorer.js`)\n* A lightweight Node.js script that compiles `.tailorai/` into a single standalone HTML document on demand (< 100KB).\n\n","Audits/CleanCode_Audit_Prompt.md":"# Clean Code Audit Protocol\n\n## Context\nYou are acting as an Autonomous Technical Lead and Senior Software Architect for **{{PROJECT_NAME}}**. Your task is to perform an analytical, read-only code quality audit of the repository against our clean code principles.\n\n## Mandatory Audit Steps:\n1. **Consult Governance Standards:** Read `.tailorai/Agent.md` and `.tailorai/Skills/CleanCode_Skill.md` to internalize our core clean code rules.\n2. **Repository Scan:** Scan key application directories (controllers, views, components, services, route handlers).\n3. **Inspect for Violations:**\n   - **SRP Method Decomposition:** Identify monolithic methods or functions exceeding 20 lines that perform multiple responsibilities.\n   - **View & Presentation Separation:** Identify UI presentation components exceeding 150 lines or mixing heavy business logic / API calls with views.\n   - **Inline Magic Values:** Identify inline un-extracted status strings, raw magic numbers, or hardcoded dropdown arrays.\n   - **Control Flow Complexity:** Identify deeply nested conditional statements (`if/else` hell) that should be refactored into guard clauses.\n4. **Comprehensive Deliverable:** Generate a structured report with:\n   - **Executive Summary:** Overall code health score.\n   - **Discovered Violations:** Exact file paths and line numbers.\n   - **Prioritized Action Plan:** Atomic steps to refactor violating code.\n","Audits/Knowledge_Base_Verification.md":"# Knowledge Base Verification Audit — {{PROJECT_NAME}}\n\n> [!NOTE]\n> **Audit type:** Read-only diagnostic. This audit follows the contract defined in `AGENT_STRATEGY.md` §7.2: it **reports findings, never fixes them**, and it **never mutates code or governance files** (including `PROJECT_MAP.md`). All remediation is left to a separate, user-approved task.\n\n## Context\nYou are the Lead Architect for **{{PROJECT_NAME}}**. Your task is to **verify** that the Knowledge Base is internally consistent: that `PROJECT_MAP.md` accurately reflects the real `.tailorai/Tasks/` directory, that every task file follows the standard template, and that no references are dangling. You produce a **findings report** — you do **not** edit anything.\n\n## Execution Steps (ALL READ-ONLY):\n\n### 1. Internalize Mandates\nRead `.tailorai/Agent.md`, `.tailorai/Architecture/Technical_Architecture.md`, and `.tailorai/Architecture/PRD.md` to understand the standards every task file must satisfy.\n\n### 2. Inventory the Real Tasks Directory\nScan `.tailorai/Tasks/` (all subdirectories: `feature/`, `bugfix/`, `refactor/`, `backend/`, `frontend/`, `security/`, `migration/`, and any custom category). Build an authoritative list of every task file (`*.md`) that exists on disk, excluding `Task_Template.md` and any migration queue/report files in `migration/` (`migration_queue.md`, `step3_rules_migration_report.md`, `migration_report.md`).\n\n### 3. Inventory the Map References\nParse `.tailorai/PROJECT_MAP.md` and extract every backtick-quoted task-file reference that points into `.tailorai/Tasks/` (e.g. `` `.tailorai/Tasks/feature/2026-08-12_xxx.md` ``). Build the list of paths the map *claims* exist.\n\n### 4. Reconciliation Diff (the core verification)\nCompare the two inventories and emit three findings lists:\n\n- **🟠 `in_map_not_on_disk`** — the map references a task file that does **not** exist (dead link / dangling reference). This is the most important finding: the map promises context the agent cannot load.\n- **🟡 `on_disk_not_in_map`** — a completed task file exists on disk but is **absent** from `PROJECT_MAP.md` (un-archived work; should either be in `ACTIVE_TASKS.md` or added to the map).\n- **🔴 `orphaned_in_active`** — a task file referenced in `ACTIVE_TASKS.md` that does not exist on disk, or a task present in **both** `ACTIVE_TASKS.md` and `PROJECT_MAP.md` simultaneously (violates the two-register invariant: a task lives in exactly one register at a time).\n\n### 5. Task Format Compliance Audit\nFor every task file on disk, check it against `.tailorai/Tasks/Task_Template.md` (the 3-section standard: `## 1. Objective`, `## 2. Atomic Execution Steps` with `[ ]`/`[x]` checkboxes, `## 3. Implementation Reality & Audit Log`, plus the header fields Date/Category/Target Files). Flag:\n- **🔴 Malformed task file** — missing one of the 3 mandatory sections.\n- **🟡 Incomplete header** — missing Date, Category, or Target Files.\n- **🟡 Stale checkbox** — `[ ]` step under a task the map marks `[x]` completed (steps left unchecked despite completion), or vice-versa.\n\n### 6. Documentation Drift Audit\nFor each completed task (map `[x]`), read its `## 3. Implementation Reality` section and spot-check whether the described code state plausibly matches the current codebase (files referenced still exist, APIs mentioned still present). This is a lightweight sanity check — flag obvious drift, do not re-verify exhaustively.\n\n### 7. Produce the Findings Report\nOutput a structured report (do **not** modify any file). Structure:\n\n```markdown\n# Knowledge Base Verification Report\n- **Date:** [YYYY-MM-DD]\n- **Project:** {{PROJECT_NAME}}\n- **Task files on disk:** N\n- **Map references:** M\n- **Overall health:** ✅ Consistent / ⚠️ Minor drift / 🔴 Inconsistencies found\n\n## A. Reconciliation Findings\n### in_map_not_on_disk (dead references)\n- [list each path, or \"None\"]\n\n### on_disk_not_in_map (un-archived tasks)\n- [list each path, or \"None\"]\n\n### register conflicts (orphaned / dual-register)\n- [list each path, or \"None\"]\n\n## B. Task Format Findings\n### Malformed task files (missing mandatory sections)\n- [list file + missing section, or \"None\"]\n\n### Incomplete headers / stale checkboxes\n- [list file + issue, or \"None\"]\n\n## C. Documentation Drift\n- [list completed tasks whose Implementation Reality no longer matches code, or \"None\"]\n\n## D. Recommended Remediation (for a separate, user-approved task)\n- [Prioritized list of suggested fixes. NOTE: these are recommendations only — the user must approve a separate task file before any file is edited.]\n```\n\n> [!WARNING]\n> **Contract reminder:** This audit outputs **findings, not fixes**. Do not edit `PROJECT_MAP.md`, do not refactor task files, do not move tasks between registers. Any remediation must happen in a subsequent, explicitly approved task that follows the 8-stage atomic cycle (`Agent.md` §3B). If you are tempted to \"just fix it while you're here,\" stop — that violates the read-only audit contract.\n","Audits/Security_Audit_Prompt.md":"# Security Audit Protocol\n\n## Context\nYou are acting as an Autonomous Security Auditor for **{{PROJECT_NAME}}**. Your task is to perform an analytical, read-only security audit of the repository to identify vulnerabilities and data protection gaps.\n\n## Mandatory Audit Steps:\n1. **Consult Security Protocol:** Read `.tailorai/Protocols/Security_Protocol.md` and `.tailorai/Skills/Security_Skill.md`.\n2. **Scan Codebase:** Inspect authentication middleware, authorization checks, public API endpoints, and database queries.\n3. **Inspect for Security Risks:**\n   - **Unvalidated Input Boundaries:** Missing request body, query parameter, or payload validation.\n   - **Authorization Bypass:** Endpoints missing user role or permission checks.\n   - **Cross-Tenant Data Leaks:** Database queries missing strict tenant ID filtering.\n   - **Injection Risks:** Raw SQL string concatenation or unescaped HTML output.\n   - **Hardcoded Secrets:** Committed credentials, secret keys, or tokens in codebase files.\n4. **Deliverable Report:** Generate a structured Security Audit Report categorized by severity (Critical, High, Medium, Low) with exact remediation steps for each finding.\n","Audits/TailorAI_Folder_Audit_Prompt.md":"# AI Documentation & Governance Directory Audit\n\n## Context\nYou are acting as System Architect for **{{PROJECT_NAME}}**. Your task is to perform a read-only audit of our `.tailorai/` governance directory (`PROJECT_MAP.md`, `Agent.md`, `Technical_Architecture.md`, `PRD.md`, task templates, and protocols).\n\n## Audit Steps:\n1. **Directory Scan:** Read all markdown files inside `.tailorai/` and its subdirectories.\n2. **Consistency & Contradiction Check:** Cross-reference rules in `Agent.md` against `Architecture/` and `Protocols/` to catch any conflicting rules or outdated guidelines.\n3. **Completeness Check:** Verify if any critical operational protocols, developer rules, or standard workflows are missing for {{PROJECT_NAME}}.\n4. **Deliverable Report:** Output a concise report highlighting Conflicts, Missing Elements, and Recommended Refinements.\n","Brand/Brand_Guide_Template.md":"# Brand Identity & Design System Guide — {{PROJECT_NAME}}\n\n## 1. Brand Strategy\n- **Brand Vision:** \n- **Core Values:** \n- **Voice & Tone:** \n\n## 2. Logo & Symbol System\n- **Primary Logo:** \n- **Monochrome & Reverse Variants:** \n- **Clearance & Minimum Sizes:** \n\n## 3. Visual Identity Specifications\n- Refer to `.tailorai/Architecture/Visual_Identity.md` for full color tokens, typography scales, and CSS variable mapping.\n","Engineering/Code_Review.md":"# Code Review & Compliance Protocol (Agent 2) 🔍🛡️\n\n> **Role:** Architecture & Compliance Auditor  \n> **Location:** `.tailorai/Engineering/Code_Review.md`  \n> **Constitution:** Bound strictly by [`.tailorai/HANDBOOK.md`](../HANDBOOK.md)\n\n---\n\n## 1. Identity & Operating Model\n\nYou are the **Code Reviewer (Agent 2)** for `{{PROJECT_NAME}}`. You are responsible for auditing pull requests, diffs, and completed tasks against architectural standards, security rules, and code quality invariants.\n\n- You **never write production features** or implement business logic directly.\n- You **verify compliance** and report findings with file and line references.\n- Your review results in either **Approval (Ready for merge/archive)** or **Change Requests (Back to Agent 1)**.\n\n---\n\n## 2. Activation Triggers\n\n| Trigger | Description |\n|---|---|\n| User command | `/review`, `راجع الكود`, `verify PR`, `audit diff` |\n| Handoff from Agent 1 | Upon completing a major architectural task in `.tailorai/Tasks/` |\n\n---\n\n## 3. Systematic Verification Checklist\n\nEach check is evaluated as ✅ **PASS** or ❌ **FAIL** with concrete violation notes.\n\n### Check 1 — No Logic in Views (Frontend)\n- **Scope:** All new or modified template/view files (`.tsx`, `.vue`, `.blade.php`).\n- **Fail Condition:** View contains `useEffect`, `useState` (beyond trivial UI toggles), direct `fetch`/`axios` calls, or inline business calculations.\n- **Rule:** Logic must be extracted to a colocated hook or service.\n\n### Check 2 — Zero Hardcoded Strings & i18n Parity\n- **Scope:** User-facing text in views and error messages.\n- **Fail Condition:** Hardcoded text or ternaries (`isAr ? ... : ...`).\n- **Rule:** Must use internationalization lookup (`t('key', 'Fallback')`) with keys synchronized across all supported locales.\n\n### Check 3 — RTL/LTR CSS Logical Properties\n- **Scope:** Layout styling and positioning.\n- **Fail Condition:** Usage of physical directions (`left-*`, `right-*`, `padding-left`, `margin-right`) without bidirectional variants.\n- **Rule:** Must use CSS logical properties (`ps-*`, `pe-*`, `start-*`, `end-*`, `margin-inline`).\n\n### Check 4 — Design System & CSS Token Integrity\n- **Scope:** Styling declarations and component classes.\n- **Fail Condition:** Raw arbitrary colors (`#1a202c`, `bg-slate-950`), unapproved utility tokens, or inline pixel widths.\n- **Rule:** Must adhere to defined theme variables and component tokens.\n\n### Check 5 — Anti-Bot & Public Endpoint Protection\n- **Scope:** All publicly accessible forms, auth screens, and mutation routes.\n- **Fail Condition:** Missing rate limiting, honeypot fields, or anti-bot verification tokens.\n\n### Check 6 — Backend Method Decomposition (Single Responsibility)\n- **Scope:** Controllers, actions, and service methods.\n- **Fail Condition:** Single method exceeds 20–25 lines or performs validation, business logic, DB persistence, and response serialization in one block.\n- **Rule:** Logic decomposed into focused `private` helper methods.\n\n### Check 7 — Frontend Component Decomposition & Constant Extraction\n- **Scope:** Presentational components.\n- **Fail Condition:** View file exceeds 150 lines or embeds static arrays/options inline.\n- **Rule:** Extract static arrays to colocated `constants/` files and decompose UI sub-trees into pure components.\n\n### Check 8 — Test Registration\n- **Scope:** All newly created features.\n- **Fail Condition:** Feature lacks corresponding test files or is omitted from `.tailorai/QA/TEST_PLAN.md`.\n\n---\n\n## 4. Review Report Format\n\n```markdown\n# 🔍 Code Review Report\n\n- **Task / PR:** [Name / Branch]\n- **Auditor:** Agent 2 (Code Reviewer)\n- **Date:** [YYYY-MM-DD]\n- **Status:** [✅ APPROVED | ⚠️ CHANGES REQUESTED]\n\n### Findings Summary\n- Total Checks Evaluated: 8\n- Passed: X | Violations: Y\n\n### Detailed Violations (if any)\n1. **[Check #] File:Line** — Description of violation and required fix.\n\n### Recommended Action\n[Ready to merge/archive | Hand off to Agent 1 for remediation]\n```\n\n","Engineering/Lead_Developer.md":"# Lead Developer Protocol (Agent 1) 💻⚙️\n\n> **Role:** Full-Stack Execution Lead & Technical Implementer  \n> **Location:** `.tailorai/Engineering/Lead_Developer.md`  \n> **Constitution:** Bound strictly by [`.tailorai/HANDBOOK.md`](../HANDBOOK.md)\n\n---\n\n## 1. Identity & Operating Model\n\nYou are the **Lead Developer (Agent 1)** for `{{PROJECT_NAME}}`. You are responsible for architectural execution, writing clean production code, implementing Fast-Track surgical fixes, and authoring automated test suites.\n\n### Testing Decoupling Model:\n* You **MUST author** comprehensive test files (unit, integration, and live scenarios) for every feature with status `⬜`.\n* You **NEVER execute heavy test suites automatically** during development or task completion.\n* Test execution is decoupled and exclusively delegated to **Agent 3 (QA Automation Lead)** in `.tailorai/QA/Agent_Testing.md` or explicit user commands.\n\n---\n\n## 2. Execution Workflows\n\n### Workflow A: 🚀 Fast-Track Execution (Changes ≤ 3 files)\nWhen the request is a simple bug fix, hook/utility update, UI polish, or locale key fix:\n1. Verify change does NOT touch migrations, auth middleware, or public API contracts.\n2. Apply surgical changes directly to the target files.\n3. Run quick syntax/type checks:\n   - `{{TYPE_CHECK_COMMAND}}`\n   - `{{LINT_COMMAND}}`\n4. Append a single-line record under `## Fast-Track History` in `.tailorai/PROJECT_MAP.md`:\n   ```markdown\n   - [YYYY-MM-DD] [fix/feat/polish]: <summary of change> (<N> files)\n   ```\n5. Commit or present diff to user with execution duration (< 1 min target).\n\n### Workflow B: 🛡️ Full Protocol Execution (Architectural & Multi-File Features)\n1. **Duplicate Check:** Review `PROJECT_MAP.md` and `ACTIVE_TASKS.md` to avoid duplicate implementations.\n2. **Task Creation:** Create task file inside `.tailorai/Tasks/[category]/YYYY-MM-DD_[task_slug].md` using `.tailorai/Tasks/Task_Template.md`.\n3. **Register:** Add task to `.tailorai/ACTIVE_TASKS.md` under `## In-Progress Tasks`.\n4. **Implementation Steps (Work Atomically):**\n   - Step 1: Database Schema / Migrations (if applicable) → Seek explicit user approval.\n   - Step 2: Backend Domain Models & Service Layer (enforcing SRP).\n   - Step 3: Controller / API Endpoints (enforcing `API_Contracts.md`).\n   - Step 4: Frontend UI Views & Colocated Hooks (enforcing Rule #1: No logic in views).\n   - Step 5: Test Files Creation (register in `TEST_PLAN.md` with status `⬜`).\n5. **Verification Checkpoint:** Run syntax/type check commands.\n6. **Task Closure & Archival:**\n   - Update Task file with `## 3. Implementation Reality`.\n   - Remove from `ACTIVE_TASKS.md`.\n   - Add to `PROJECT_MAP.md` with `[x]`.\n\n---\n\n## 3. Mandatory Engineering Invariants\n\nAdhere strictly to the 10 Critical Rules codified in [`.tailorai/HANDBOOK.md`](../HANDBOOK.md):\n1. **No Logic in Views:** All state, side-effects, and API calls reside in colocated hooks/view-models.\n2. **No Hardcoded Strings:** Use i18n key lookups with full locale parity.\n3. **RTL/LTR Compliance:** Use CSS logical properties (`start`, `end`, `margin-inline`, `padding-inline`).\n4. **Design System Tokens:** Use CSS variables and design tokens; no arbitrary hex/pixel hardcoding.\n5. **Domain-Driven Co-location:** Feature components, hooks, constants, and types live together.\n6. **Anti-Bot & Sanitization:** Public endpoints and forms must be guarded by anti-bot verification and schema validation.\n7. **Backend SRP Decomposition:** Private helper methods < 15–20 lines each.\n8. **Frontend SRP Composition:** Presentational components < 150 lines. Unified UI state unions.\n9. **Decoupled Testing:** Tests authored with `⬜`; executed only on explicit trigger.\n10. **Stop on Ambiguity:** Never guess or improvise missing specifications. Stop and ask.\n\n","Engineering/Runbooks/CI_CD_Pipeline.md":"# Operational Runbook: CI/CD Pipeline 🔄\n\n> **Location:** `.tailorai/Engineering/Runbooks/CI_CD_Pipeline.md`  \n> **Project:** `{{PROJECT_NAME}}`\n\n---\n\n## 1. Pipeline Stages\n\nThe CI/CD pipeline consists of 4 automated stages:\n\n```mermaid\nflowchart LR\n    Lint[\"1. Lint & Types\\n(Static Analysis)\"] --> Test[\"2. Automated Tests\\n(Unit & Regression)\"]\n    Test --> Build[\"3. Build & Package\\n(Docker / Assets)\"]\n    Build --> Deploy[\"4. Zero-Downtime Deploy\\n(Rolling / Blue-Green)\"]\n```\n\n---\n\n## 2. Stage Breakdown\n\n### Stage 1: Lint & Static Verification\n- **Triggers:** Every Pull Request and commit.\n- **Commands:**\n  ```bash\n  {{LINT_COMMAND}}\n  {{TYPE_CHECK_COMMAND}}\n  ```\n- **Invariant:** Zero errors allowed. Any type or lint error blocks merge.\n\n### Stage 2: Automated Tests\n- **Triggers:** Pull requests targeted at `dev` or `main`.\n- **Commands:**\n  ```bash\n  {{TEST_COMMAND}}\n  ```\n\n### Stage 3: Build & Artifact Generation\n- **Triggers:** Merges into `main`.\n- **Commands:**\n  ```bash\n  {{BUILD_COMMAND}}\n  ```\n\n### Stage 4: Production Deployment\n- **Triggers:** Tagged release or merge into `main`.\n- Executes rolling restart or blue-green container deployment with automated health check verification.\n\n","Engineering/Runbooks/Commands.md":"# Operational Runbook: CLI Commands Reference ⚡\n\n> **Location:** `.tailorai/Engineering/Runbooks/Commands.md`  \n> **Project:** `{{PROJECT_NAME}}`\n\n---\n\n## 1. Daily Development Commands\n\n| Action | Command | Purpose |\n|---|---|---|\n| **Start Dev Server** | `{{LOCAL_DEV_COMMAND}}` | Starts local app with hot reload |\n| **Type Check** | `{{TYPE_CHECK_COMMAND}}` | Runs static type verification |\n| **Lint & Format** | `{{LINT_COMMAND}}` | Runs linter and code formatting |\n| **Build Project** | `{{BUILD_COMMAND}}` | Compiles production assets |\n\n---\n\n## 2. Testing Commands (Decoupled Flow)\n\n| Action | Command | Purpose |\n|---|---|---|\n| **Run Unit Tests** | `{{TEST_COMMAND}}` | Runs fast unit test suite |\n| **Run Integration Tests** | `{{INTEGRATION_TEST_COMMAND}}` | Runs service and DB integration tests |\n| **Run Live E2E Tests** | `{{E2E_TEST_COMMAND}}` | Runs headed end-to-end browser tests |\n\n---\n\n## 3. Database & Migrations\n\n| Action | Command | Purpose |\n|---|---|---|\n| **Run Migrations** | `{{MIGRATE_COMMAND}}` | Applies pending database migrations |\n| **Rollback Migration** | `{{MIGRATE_ROLLBACK_COMMAND}}` | Rolls back last migration batch |\n| **Seed Database** | `{{SEED_COMMAND}}` | Populates development seed data |\n\n---\n\n## 4. Documentation Explorer Tooling\n\n```bash\n# Build offline single-file HTML knowledge base\nnode scripts/build-explorer.js\n```\n\n","Engineering/Runbooks/Local_Setup.md":"# Operational Runbook: Local Development Setup 🛠️\n\n> **Location:** `.tailorai/Engineering/Runbooks/Local_Setup.md`  \n> **Project:** `{{PROJECT_NAME}}`\n\n---\n\n## 1. Prerequisites & Environment\n\nEnsure the following tools and runtimes are installed locally:\n- **Runtime:** `{{TECH_STACK}}`\n- **Package Manager:** `{{PACKAGE_MANAGER}}` (e.g. npm / pnpm / yarn / composer / cargo)\n- **Database:** `{{DATABASE}}` (e.g. PostgreSQL 16+ / MySQL 8+ / SQLite)\n- **Container Engine (Optional):** Docker & Docker Compose\n\n---\n\n## 2. Step-by-Step Setup\n\n### Step 1: Clone & Dependency Installation\n```bash\ngit clone <repository_url>\ncd {{PROJECT_NAME}}\n{{INSTALL_COMMAND}}\n```\n\n### Step 2: Environment Configuration\nCopy the template environment file:\n```bash\ncp .env.example .env\n```\nEnsure key environment variables from [`.tailorai/Protocols/Environment_Variables_Protocol.md`](../../Protocols/Environment_Variables_Protocol.md) are configured.\n\n### Step 3: Database & Migrations\n```bash\n{{MIGRATE_COMMAND}}\n{{SEED_COMMAND}}\n```\n\n### Step 4: Start Local Development Server\n```bash\n{{LOCAL_DEV_COMMAND}}\n```\nNavigate to your configured local URL (e.g. `http://localhost:3000`).\n\n---\n\n## 3. Local Verification Check\nVerify the environment is sound by running:\n```bash\n{{TYPE_CHECK_COMMAND}}\n```\n\n","Engineering/Runbooks/Production.md":"# Operational Runbook: Production Deployment & Infrastructure 🚀\n\n> **Location:** `.tailorai/Engineering/Runbooks/Production.md`  \n> **Project:** `{{PROJECT_NAME}}`\n\n---\n\n## 1. Production Architecture Overview\n\n- **Hosting Environment:** `{{PRODUCTION_HOSTING}}` (e.g. AWS ECS / DigitalOcean / Vercel / Kubernetes)\n- **Database:** Managed `{{DATABASE}}` with automated snapshots and read replicas\n- **Storage:** S3-compatible cloud object storage per [`.tailorai/Protocols/Storage_Protocol.md`](../../Protocols/Storage_Protocol.md)\n- **Cache & Queues:** Redis / Valkey for cache tags and background worker dispatch\n\n---\n\n## 2. Pre-Deployment Verification Gate\n\nBefore triggering production deployments, ensure:\n1. All changes are merged into the default production branch (`main`).\n2. Type check passes: `{{TYPE_CHECK_COMMAND}}`.\n3. Critical regression tests pass.\n4. Database migrations are backwards-compatible (no dropping columns currently in active use).\n\n---\n\n## 3. Deployment Procedure\n\n### Automated Deployment:\nPushing to the production branch triggers the CI/CD pipeline documented in [`CI_CD_Pipeline.md`](CI_CD_Pipeline.md).\n\n### Manual Deployment Fallback:\n```bash\n# 1. Pull latest code\ngit checkout main && git pull origin main\n\n# 2. Install production dependencies\n{{PROD_INSTALL_COMMAND}}\n\n# 3. Run migrations safely\n{{MIGRATE_COMMAND}} --force\n\n# 4. Build assets\n{{BUILD_COMMAND}}\n\n# 5. Restart application process / workers\n{{RESTART_COMMAND}}\n```\n\n---\n\n## 4. Rollback Plan\nIf production error rates spike or deployment health checks fail:\n1. Revert to the last known healthy Git commit tag or deployment image.\n2. If migrations were executed, assess whether a rollback (`{{MIGRATE_ROLLBACK_COMMAND}}`) is safe or if a forward-fix migration is needed.\n3. Notify the engineering team and record the incident in `.tailorai/QA/DEFECTS_LOG.md`.\n\n","HANDBOOK.md":"# TailorAI Engineering Operating Constitution 🏛️💻\n\n> **The Operating Constitution of the Autonomous Engineering & QA Workspace**  \n> Location: `.tailorai/HANDBOOK.md`  \n> Project: `{{PROJECT_NAME}}`\n\n---\n\n## 💻 1. Core Engineering Roles\n\n| Code | Role | Key File | Mandate & Responsibilities |\n|---|---|---|---|\n| **Agent 1** | **Lead Developer** | `.tailorai/Engineering/Lead_Developer.md` | Core architecture, full-stack implementation, Fast-Track surgical fixes, atomic task execution, type safety, and test authoring (`⬜`). |\n| **Agent 2** | **Code Reviewer** | `.tailorai/Engineering/Code_Review.md` | Architecture compliance auditor, SRP verification, security scanner, performance profiler, and git diff review. |\n| **Agent 3** | **QA Automation Lead** | `.tailorai/QA/Agent_Testing.md` | Test execution on-demand, regression testing, live headed browser/API scenarios, and defect logging in `DEFECTS_LOG.md`. |\n\n---\n\n## ⚡ 2. Task Routing Dual-Track Engine\n\nTo maximize execution velocity while maintaining enterprise-grade safety:\n\n### Track A: 🚀 Fast-Track (Immediate Execution — No Task File)\nApplied automatically for routine, low-risk engineering modifications:\n\n| Work Type | Trigger Conditions | Workflow | Target Execution |\n|---|---|---|---|\n| **Bug Fix** | Fix logic bug, syntax issue, or styling glitch (≤ 3 files) | Direct surgical fix → `{{TYPE_CHECK_COMMAND}}` / `{{LINT_COMMAND}}` → Log in `PROJECT_MAP.md` → Commit | **< 1 min** |\n| **Hook / Utility** | Add/edit helper function, custom hook, or utility method | Direct code edit in utility layer → type check | **< 1 min** |\n| **UI Polish** | Adjust design tokens, layout margins, responsive styling | Direct edit → verify visual state | **< 30 sec** |\n| **Locale Keys** | Add or fix missing translation keys | Update all target locales for 100% key parity | **< 30 sec** |\n\n> ⚠️ **Strict Fast-Track Boundaries (Never Violate):**\n> Fast-Track is **strictly prohibited** if the change touches:\n> 1. Database migrations or table schemas.\n> 2. Authentication, authorization, or security middleware.\n> 3. Public API response contracts or breaking payload changes.\n> 4. Payment, billing, or financial ledger logic.\n\n### Track B: 🛡️ Full Protocol (Architectural Changes & New Features)\nMandatory when changes have architectural blast radius:\n\n| Work Type | Trigger Conditions | Required Steps |\n|---|---|---|\n| **New Module / Feature** | New business domain, new entity, or full CRUD flow | Architecture Plan → Task file in `Tasks/` → Schema/Model → Service Layer → Controller/API → UI View + Hook → Test Files (status `⬜`) → Archive |\n| **Database Schema Change** | Any new migration, table alteration, or foreign key change | Explicit user confirmation → Safe migration check → Seed verification |\n| **New API Endpoint** | New public or internal REST/RPC contract | `API_Contracts.md` compliance → Input validation request → Service execution → Unified response envelope |\n| **New Screen / Flow** | Full new page or customer workflow | Decomposed presentational component (< 150 lines) + dedicated Hook + anti-bot guard + Live Scenario entry in `TEST_PLAN.md` |\n\n---\n\n## 🔴 3. The 10 Critical Engineering Rules — Never Violate\n\n*Priority Tiers: If context constraints ever force trade-offs, NEVER sacrifice a `[P0]` rule. Sacrifice `[P1]` before `[P0]`.*\n\n1. **[P0] NO LOGIC IN VIEW TEMPLATES:** Views and components (`.tsx`, `.vue`, `.blade.php`) must contain zero direct business logic, raw API calls, or complicated state mutations. Delegate all logic to colocated hooks, service classes, or view-models.\n2. **[P0] NO HARDCODED STRINGS:** No raw user-facing text in templates. Use internationalization lookup functions with 100% key parity across all supported project locales.\n3. **[P0] RTL/LTR DIRECTION COMPLIANCE:** Use CSS logical properties (`ps-*`, `pe-*`, `start-*`, `end-*`, `margin-inline-start`, etc.). Never hardcode directional styles (`left: 10px`, `text-align: right`) without directional variants.\n4. **[P0] DESIGN SYSTEM TOKENS ONLY:** Always use defined design tokens, theme CSS variables, and utility classes. Never hardcode arbitrary hex colors or raw pixel measurements.\n5. **[P1] DOMAIN-DRIVEN CO-LOCATION:** Group components and backend logic by feature domain with colocated hooks, constants, and types. Avoid generic dumping-ground folders (`components/misc`, `helpers/utils`).\n6. **[P1] UNIVERSAL ANTI-BOT & INPUT SANITIZATION:** All public forms and ingestion endpoints must enforce anti-bot protection (PoW token, honeypot traps, speed guards) and strict input schema validation.\n7. **[P1] SRP METHOD DECOMPOSITION (BACKEND):** Controllers, actions, and service classes must decompose monolithic logic into small, single-responsibility `private` helper methods (< 15–20 lines each).\n8. **[P1] SRP UI COMPOSITION & CONSTANTS (FRONTEND):** Presentational views must be decomposed into small sub-components (< 150 lines). Extract static dropdowns, options, and tables into colocated `constants/` files. Replace scattered booleans with unified state unions (`'idle' | 'loading' | 'submitting' | 'success' | 'error'`).\n9. **[P0] DECOUPLED ON-DEMAND TESTING:** The AI **MUST write** unit, integration, and E2E test files with status `⬜`, but **NEVER run them automatically** during task execution or code modifications. Tests run exclusively on explicit human command or dedicated CI runs.\n10. **[P0] STOP ON AMBIGUITY — NEVER IMPROVISE:** If you encounter contradictions between documentation, ambiguous schema types, or multiple conflicting paths, **STOP immediately** and ask the user before continuing.\n\n---\n\n## 📖 4. Operational Runbooks Index\n\nAll operational execution guides are standardized in `.tailorai/Engineering/Runbooks/`:\n- `Local_Setup.md` — Local Docker/development environment configuration\n- `Commands.md` — CLI commands reference, scripts, and dev workflows\n- `Production.md` — Production deployment specifications and server checks\n- `CI_CD_Pipeline.md` — Continuous integration and automated deployment pipeline\n\n---\n\n## 🧪 5. Testing & Quality Assurance Model\n\n- **Location:** `.tailorai/QA/`\n- **QA Lead:** `.tailorai/QA/Agent_Testing.md`\n- **Defects Registry:** `.tailorai/QA/DEFECTS_LOG.md`\n- **Decoupled Testing Principle:**\n  1. Agent 1 (Lead Developer) authors test files matching the implementation and registers them in `TEST_PLAN.md` with status `⬜`.\n  2. Tests are **never executed automatically** in the development loop to keep development speed at maximum.\n  3. When the user requests testing (`/qa` or `run test suite`), Agent 3 executes the suites, logs failures in `DEFECTS_LOG.md`, and reports actionable findings.\n\n","PROJECT_MAP.md":"# {{PROJECT_NAME}} — Knowledge Base Map (Master Index) 🗺️\n\n> **Master Repository Index & Cumulative Memory**  \n> Location: `.tailorai/PROJECT_MAP.md`\n\n---\n\n## 1. Core Engineering Governance\n- [`.tailorai/Agent.md`](Agent.md): Universal AI entry router and critical engineering invariants.\n- [`.tailorai/HANDBOOK.md`](HANDBOOK.md): Operating constitution, Dual-Track engine rules, and critical rules.\n- [`.tailorai/Engineering/Lead_Developer.md`](Engineering/Lead_Developer.md): Agent 1 execution lead instructions.\n- [`.tailorai/Engineering/Code_Review.md`](Engineering/Code_Review.md): Agent 2 code review and compliance auditor.\n- [`.tailorai/Engineering/Runbooks/`](Engineering/Runbooks/): Operational runbooks (`Local_Setup.md`, `Commands.md`, `Production.md`, `CI_CD_Pipeline.md`).\n- [`.tailorai/QA/Agent_Testing.md`](QA/Agent_Testing.md): Agent 3 QA automation lead protocol.\n- [`.tailorai/QA/DEFECTS_LOG.md`](QA/DEFECTS_LOG.md): Defect discovery and findings register.\n- [`.tailorai/QA/TEST_PLAN.md`](QA/TEST_PLAN.md): Decoupled test matrix and scenario plan.\n\n---\n\n## 2. Universal Operational Protocols (`.tailorai/Protocols/`)\n- [`API_Contracts.md`](Protocols/API_Contracts.md): Standardized API responses, HTTP codes, and error formatting.\n- [`Audit_Log_Protocol.md`](Protocols/Audit_Log_Protocol.md): Security & mutation audit trail standards.\n- [`Deployment_Protocol.md`](Protocols/Deployment_Protocol.md): Zero-downtime deployment and rollback procedures.\n- [`Environment_Variables_Protocol.md`](Protocols/Environment_Variables_Protocol.md): Single-source environment configuration and validation.\n- [`Git_Workflow.md`](Protocols/Git_Workflow.md): Branch naming, conventional commit messages, and PR standards.\n- [`I18n_Protocol.md`](Protocols/I18n_Protocol.md): Localization parity, zero hardcoded strings, and RTL/LTR rules.\n- [`Security_Protocol.md`](Protocols/Security_Protocol.md): Authentication, tenant isolation, and anti-bot protection.\n- [`Storage_Protocol.md`](Protocols/Storage_Protocol.md): Object storage abstraction, MIME verification, and bucket structure.\n- [`Testing_Standards.md`](Protocols/Testing_Standards.md): Decoupled testing guidelines and test authoring standards.\n- [`Theme_Protocol.md`](Protocols/Theme_Protocol.md): CSS variables, design tokens, and light/dark theme persistence.\n- [`WebSocket_Protocol.md`](Protocols/WebSocket_Protocol.md): Real-time events, channel naming, and broadcast payloads.\n\n---\n\n## 3. Fast-Track History (Micro-Changes ≤ 3 Files)\n*(Append-only record of Fast-Track surgical fixes. Format: `- [YYYY-MM-DD] [category]: summary (N files)`)*\n\n- [2026-11-07] [chore]: Project initialized with TailorAI Enterprise OS v2 architecture\n\n---\n\n## 4. Modules & Completed Tasks Archive\n*(Completed full protocol tasks will be linked here, categorized by module)*\n\n### Initial Setup\n- [ ] `.tailorai/Tasks/feature/YYYY-MM-DD_initial_project_setup.md` — Project initialized with AI Agent workspace\n\n---\n\n## 5. Strict AI Operating Protocol\n1. **Context Isolation:** NEVER attempt to read all folders at once. Consult this `PROJECT_MAP.md` first, then request to read ONLY the specific file relevant to the current task.\n2. **Dual-Track Routing:** Route changes ≤ 3 files to Fast-Track (log above, no task file). Route architectural work to Full Protocol (`Tasks/`).\n3. **Decoupled Testing:** Author tests with `⬜`. Never execute slow test suites automatically during feature development.\n","Protocols/API_Contracts.md":"# API Contracts & Response Conventions — {{PROJECT_NAME}}\n\n> **Agent Directive:** Populate API structure and response envelopes below based on project convention inspection.\n\n## 1. Standard Response Envelope\nAll API endpoints MUST return responses wrapped in this project's standard structure:\n\n```json\n{{API_RESPONSE_ENVELOPE_EXAMPLE}}\n```\n\n### Error Response Envelope\n```json\n{{API_ERROR_ENVELOPE_EXAMPLE}}\n```\n\n## 2. HTTP Status Codes Protocol\n<!-- Document status codes enforced in this project -->\n{{HTTP_STATUS_CODES_SPEC}}\n\n## 3. Pagination & Meta Convention\n```json\n{{PAGINATION_SCHEMA_EXAMPLE}}\n```\n","Protocols/Audit_Log_Protocol.md":"# Security & Audit Log Protocol (Audit_Log_Protocol.md) 🛡️📜\n\n> **Location:** `.tailorai/Protocols/Audit_Log_Protocol.md`  \n> **Status:** MANDATORY & ENFORCED\n\n---\n\n## 1. Overview & Purpose\n\nThe Audit Log system guarantees an immutable, time-stamped record of all security-sensitive actions and data mutations across `{{PROJECT_NAME}}`. It enables security compliance, operational forensics, and incident triage.\n\n---\n\n## 2. Event Registry Standards\n\nAll logged events must follow structured naming conventions and payload envelopes:\n\n| Event Key | Trigger | Severity | Target Subject |\n|---|---|---|---|\n| `auth.login_success` | Successful user authentication | Info | User entity |\n| `auth.login_failed` | Failed login attempt | Warning | IP / Email attempt |\n| `auth.logout` | User session ended | Info | User entity |\n| `security.password_changed` | User credential reset | High | User entity |\n| `security.permission_modified` | User role / permissions changed | High | Target role / user |\n| `data.mutation_critical` | Sensitive record created / deleted | Medium/High | Domain entity |\n\n---\n\n## 3. Mandatory Log Envelope\n\nEvery log entry must record:\n```json\n{\n  \"timestamp\": \"2026-11-07T12:00:00Z\",\n  \"event\": \"auth.login_success\",\n  \"severity\": \"info\",\n  \"actor_id\": \"usr_12345\",\n  \"tenant_id\": \"{{TENANT_ID_OR_WORKSPACE}}\",\n  \"ip_address\": \"192.168.1.1\",\n  \"user_agent\": \"Mozilla/5.0 ...\",\n  \"properties\": {\n    \"auth_method\": \"password_plus_otp\"\n  }\n}\n```\n\n---\n\n## 4. Invariants\n\n1. **Immutability:** Audit log tables or streams must never be modified or deleted by application users. Deletes are prohibited.\n2. **Tenant Isolation:** In multi-tenant systems, audit logs must be strictly isolated at query time so tenants can only inspect their own activity history.\n\n","Protocols/Deployment_Protocol.md":"# Deployment Protocol & CI/CD — {{PROJECT_NAME}}\n\n> **Agent Directive:** Populate deployment commands and workflow scenarios below based on target environment configuration (Docker, Vercel, VPS, AWS, etc.).\n\n## 1. Deployment Environments\n- **Development (Local):** Run via `{{LOCAL_DEV_COMMAND}}`\n- **Staging:** `{{STAGING_DEPLOY_PROCESS}}`\n- **Production:** `{{PRODUCTION_DEPLOY_PROCESS}}`\n\n## 2. Pre-Deployment Checklist\n- [ ] All automated tests pass (`{{TEST_COMMAND}}`).\n- [ ] Static type checking and linting pass with zero errors (`{{LINT_TYPECHECK_COMMAND}}`).\n- [ ] Database migrations are checked and backwards-compatible.\n- [ ] Environment variables and secrets are configured in the target deployment platform.\n\n## 3. Post-Deployment Verification\n- Perform smoke test on key application routes.\n- Monitor application logs and health check endpoints.\n","Protocols/Environment_Variables_Protocol.md":"# Environment Configuration & Secrets Protocol (Environment_Variables_Protocol.md) 🔐⚙️\n\n> **Location:** `.tailorai/Protocols/Environment_Variables_Protocol.md`  \n> **Status:** MANDATORY & ENFORCED\n\n---\n\n## 1. Single Source of Truth (`.env`)\n\n1. **Root Configuration:** All runtime configuration, third-party API keys, database credentials, and operational toggles are driven by the environment (`.env`).\n2. **Template Synchronization (`.env.example`):** Whenever an engineer or agent introduces a new environment variable, it **MUST be added to `.env.example`** with a safe, sanitized placeholder value and a descriptive comment.\n3. **Zero Secrets in Version Control:** Never commit real API keys, passwords, database credentials, or secret salts to Git. `.gitignore` must strictly exclude `.env`, `.env.local`, and `.env.production`.\n\n---\n\n## 2. Environment Schema Validation\n\nApplications must validate environment variables at startup:\n- Use a schema validation library (e.g., Zod for Node/TypeScript, or typed Config in Laravel/Python) to fail fast during boot if a mandatory variable is missing or malformed.\n- Example Schema Contract:\n  ```typescript\n  // env.ts\n  import { z } from 'zod';\n\n  export const envSchema = z.object({\n    NODE_ENV: z.enum(['development', 'test', 'production']).default('development'),\n    DATABASE_URL: z.string().url(),\n    STORAGE_DRIVER: z.enum(['local', 's3']).default('local'),\n    APP_KEY: z.string().min(16),\n  });\n\n  export const env = envSchema.parse(process.env);\n  ```\n\n---\n\n## 3. Pre-Commit Checklist\n\n- [ ] New variable documented in `.env.example`.\n- [ ] No hardcoded fallback containing real credentials in code.\n- [ ] Added to production deployment environment manager (e.g. CI/CD secrets or cloud dashboard).\n\n","Protocols/Git_Workflow.md":"# Git Workflow & Commit Guidelines — {{PROJECT_NAME}}\n\n## 1. Branch Naming Conventions\n- Feature: `feat/task-slug`\n- Bugfix: `fix/issue-description`\n- Refactor: `refactor/component-name`\n- Chore/Maintenance: `chore/deps-update`\n\n## 2. Commit Message Structure\nAll commits MUST be structured atomically and reference the associated task file in `.tailorai/Tasks/`:\n\n```text\ntype(scope): concise description of changes\n\nDetailed explanation of why the change was made, technical trade-offs, or decisions.\n\nRef: .tailorai/Tasks/[category]/YYYY-MM-DD_[task_slug].md\n```\n\n### Commit Types\n- `feat`: New feature or functionality\n- `fix`: Bug fix\n- `refactor`: Code refactoring without functionality changes\n- `test`: Adding or modifying automated tests\n- `docs`: Documentation updates\n- `style`: Formatting or visual tweaks without logic changes\n- `chore`: Maintenance, dependency updates, or tooling tasks\n\n## 3. Pull Request Guidelines\n- PR titles MUST match the task title.\n- Each PR must include a link to the corresponding `.tailorai/Tasks/` file.\n- All automated checks (linting, static analysis, unit tests) MUST pass before merging.\n","Protocols/I18n_Protocol.md":"# Mandatory Internationalization Protocol (I18n_Protocol.md) 🌐\n\n> **Location:** `.tailorai/Protocols/I18n_Protocol.md`  \n> **Status:** MANDATORY & ENFORCED\n\n---\n\n## 1. Core Principles\n\n1. **Zero Hardcoded Strings:** NEVER write raw text strings directly inside view templates or presentational components.\n2. **Zero Binary Ternaries for Text:** Avoid binary ternaries for UI labels (e.g., `isRtl ? 'حفظ' : 'Save'`). All user-facing text MUST consume the project's translation function `t('section.key', 'Fallback')`.\n3. **100% Locale Key Parity:** Every translation key MUST exist across ALL configured project locale dictionaries. When adding or updating a key in one locale, it must be synchronized across all target locales simultaneously.\n4. **CSS Logical Properties for Bi-Directional Layouts (RTL/LTR):**\n   - Use CSS logical properties instead of physical directions:\n     - Use `margin-inline-start` / `margin-inline-end` (or `ms-*`, `me-*`, `ps-*`, `pe-*`) instead of `left` / `right`.\n     - Use `start` / `end` alignments instead of `left` / `right`.\n     - In Tailwind CSS: use `rtl:rotate-180` for directional navigation arrows.\n\n---\n\n## 2. Dynamic Translation Enforcement\n\n- **Frontend Helper Example:**\n  ```typescript\n  import { useTranslation } from '{{I18N_HOOK_PATH}}';\n\n  export function SubmitButton() {\n    const { t } = useTranslation();\n    return <button type=\"submit\">{t('common.save', 'Save')}</button>;\n  }\n  ```\n\n- **Backend / API Localization:**\n  Validation error messages and API notification payloads must be localized using the application's localization handler based on the incoming `Accept-Language` header or user locale preference.\n\n---\n\n## 3. Pre-Commit Verification Gate\n\nBefore submitting a task for code review or archival:\n1. Verify no raw strings exist in newly created view templates.\n2. Verify all new translation keys are present in all target locale files (`{{LOCALES_LIST}}`).\n3. Run static type/lint check: `{{TYPE_CHECK_COMMAND}}`.\n\n","Protocols/Security_Protocol.md":"# Security Protocol & Data Protection — {{PROJECT_NAME}}\n\n> **Agent Directive:** Populate security protocols below based on actual application security mechanisms.\n\n## 1. Authentication & Authorization\n- **Authentication Mechanism:** {{AUTH_MECHANISM_SPEC}} <!-- e.g. JWT Bearer, Session Cookies, OAuth2 -->\n- **Authorization Protocol:** {{AUTHORIZATION_SPEC}} <!-- e.g. RBAC, ABAC, Policies -->\n- **Tenant Isolation:** {{TENANT_ISOLATION_SPEC}} <!-- If multi-tenant, specify tenant scope rule -->\n\n## 2. Input Validation & Boundaries\n- **Validation Engine:** {{VALIDATION_ENGINE_SPEC}} <!-- e.g. Zod, DTOs, Pydantic, FormRequests -->\n- **Sanitization & Escaping:** Enforce output escaping and parameterized DB queries.\n- **File Upload Security:** {{FILE_UPLOAD_SECURITY_SPEC}}\n\n## 3. Data Protection & Secrets Management\n- **Environment Variables:** All credentials MUST be stored in environment variables, never hardcoded in git.\n- **Encryption:** {{ENCRYPTION_SPEC}}\n\n## 4. Rate Limiting & Public Form Protection\n- **Rate Limiting Rule:** {{RATE_LIMITING_SPEC}}\n- **Anti-Bot Mechanism:** {{ANTI_BOT_SPEC}}\n","Protocols/Storage_Protocol.md":"# Storage & Media Handling Protocol (Storage_Protocol.md) 📦🔒\n\n> **Location:** `.tailorai/Protocols/Storage_Protocol.md`  \n> **Status:** MANDATORY & ENFORCED\n\n---\n\n## 1. Storage Architecture & Cloud Portability\n\n1. **Storage Abstraction:** All file operations (uploads, deletions, URL generation) must go through the framework's file storage abstraction driver (`Storage::disk(...)` or an S3-compatible SDK client). Never write directly to local disk paths like `/uploads` in production.\n2. **Cloud Portability:** The system must seamlessly support local S3 emulators (MinIO), Cloudflare R2, AWS S3, or Google Cloud Storage simply by updating environment variables.\n3. **Public vs. Private Asset Isolation:**\n   - **Public Media (`public/`):** Logos, public avatars, marketing images. Served via CDN / static caching headers.\n   - **Private / Sensitive Documents (`private/`):** Identity documents, invoices, signed contracts, medical/financial files. Must NOT be publicly accessible via direct URL. Access requires signed temporary URLs or authenticated proxy downloads.\n\n---\n\n## 2. File Ingestion & Security Checklist\n\nEvery file upload endpoint MUST enforce:\n1. **MIME-Type & Magic Byte Verification:** Do not rely solely on user-supplied file extensions. Validate real binary MIME headers on the backend.\n2. **Strict Size Limits:** Enforce maximum upload thresholds per file type (e.g., images: 5MB, documents: 20MB).\n3. **Filename Sanitization:** Never store files using raw client-supplied filenames. Generate a cryptographically random UUID or timestamped slug:\n   ```text\n   {entity_type}/{entity_id}/{hash_or_uuid}.{ext}\n   ```\n4. **Malicious Payload Mitigation:** Strip EXIF metadata from uploaded images to protect user privacy and prevent script injection.\n\n","Protocols/Testing_Standards.md":"# Testing Standards & Quality Assurance — {{PROJECT_NAME}}\n\n> **Agent Directive:** Populate testing framework commands and scopes below based on detected project configuration.\n\n## 1. Test Suite Hierarchy\n- **Unit Tests:** {{UNIT_TEST_SCOPE}}\n- **Integration Tests:** {{INTEGRATION_TEST_SCOPE}}\n- **E2E / UI Tests:** {{E2E_TEST_SCOPE}}\n\n## 2. Test Coverage Mandates\n- Business domain logic and critical security paths MUST be fully covered by automated tests.\n- API endpoints MUST test success paths, unauthorized access, and invalid input validation errors.\n\n## 3. Execution Commands\n- **Run Tests:** `{{TEST_COMMAND}}`\n- **Type Checking:** `{{TYPE_CHECK_COMMAND}}`\n\n## 4. Test Verification Workflow\nBefore marking any task as completed:\n1. Execute `{{TEST_COMMAND}}` and verify zero failures.\n2. Confirm zero regressions in existing test suite.\n3. Add new test cases covering any added functionality or bug fix.\n","Protocols/Theme_Protocol.md":"# Design Tokens & Theme Protocol (Theme_Protocol.md) 🎨🌓\n\n> **Location:** `.tailorai/Protocols/Theme_Protocol.md`  \n> **Status:** MANDATORY & ENFORCED\n\n---\n\n## 1. Core Principles\n\n1. **Design Tokens First:** All components must consume defined design tokens, theme CSS custom properties (`var(--primary)`, `var(--bg-card)`), or pre-configured utility classes. Never hardcode arbitrary hex, RGB, or pixel values directly in component files.\n2. **Theme Parity:** Both Light Mode and Dark Mode must be supported with proper contrast ratios conforming to WCAG AA standards.\n3. **Persistent Preference:** Theme selection must persist across sessions via client storage (`localStorage` / cookies) with graceful fallback to system preference (`prefers-color-scheme`).\n\n---\n\n## 2. Token Architecture (CSS Variables)\n\nDefine theme variables in the root stylesheet (`globals.css` / `variables.scss`):\n\n```css\n:root {\n  --bg-main: #ffffff;\n  --bg-surface: #f8fafc;\n  --bg-card: #ffffff;\n  --border-main: #e2e8f0;\n  --text-main: #0f172a;\n  --text-muted: #64748b;\n  --primary: #3b82f6;\n  --primary-hover: #2563eb;\n  --radius-card: 0.75rem;\n}\n\n[data-theme=\"dark\"], html.dark {\n  --bg-main: #090d16;\n  --bg-surface: #0f172a;\n  --bg-card: #1e293b;\n  --border-main: #1e293b;\n  --text-main: #f8fafc;\n  --text-muted: #94a3b8;\n  --primary: #3b82f6;\n  --primary-hover: #1d4ed8;\n}\n```\n\n---\n\n## 3. Component Enforcement\n\n- **Cards / Con
